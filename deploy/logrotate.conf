# Kingdom Prime — logrotate configuration
# ติดตั้ง: sudo cp deploy/logrotate.conf /etc/logrotate.d/kingdom_prime

/home/ubuntu/Auto-/data/*.csv {
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    create 640 ubuntu ubuntu
    dateext
    dateformat -%Y%m%d
}

/home/ubuntu/Auto-/data/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 640 ubuntu ubuntu
}
