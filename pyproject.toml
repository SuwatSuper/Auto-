[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-system-v2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "websockets>=14",
    "orjson>=3.10",
    "structlog>=24",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=2.1",
    "hypothesis==6.119.4",
    "pytest-cov>=5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
# Single source of truth for type checking (mypy.ini was removed). Strict mode
# is enforced for the whole codebase with NO per-module error suppressions —
# every module under src/ (except the vendored TA stub in src/vendor_ta) type-checks clean.
strict = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
exclude = ["src/vendor_ta/"]

# Vendored deterministic TA stub (pandas/numpy math) — excluded from strict checking.
[[tool.mypy.overrides]]
module = "vendor_ta.*"
ignore_errors = true

# Single source of truth for pytest (pytest.ini was removed).
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: end-to-end tests that hit external services; skipped by default",
]
filterwarnings = [
    "error::RuntimeWarning",
    "error::DeprecationWarning",
    "ignore::DeprecationWarning:websockets.*",
    "ignore::pandas.errors.Pandas4Warning",
    "ignore::FutureWarning:vendor_ta.*",
    # Third-party: starlette's TestClient warns that it drives httpx (not the
    # unreleased httpx2). Test-only, nothing we can action, so it's silenced.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
# main.py is the uvicorn ASGI entrypoint (production wiring glue, no logic).
omit = ["src/main.py"]

[tool.coverage.report]
# Exclude defensively-unreachable / non-runtime lines from the coverage gate.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",
    "@(typing\\.)?overload",
]
