# OBJ-TEST — config สำหรับ lint/format (ruff + black)
# ขอบเขตบังคับใน CI: โมดูลใหม่/agent layer (โค้ดที่ดูแลในเฟสนี้). โค้ด legacy (parser/rules/main)
# ค่อยขยายเมื่อทำ OBJ-MAINT (ซอยไฟล์) เพื่อกัน regression ระหว่างจัดรูปแบบไฟล์ใหญ่.
[tool.pytest.ini_options]
# เทสทุกตัวเป็น "standalone script" (รันด้วย python3 <file>.py) ไม่ใช่ pytest-native function.
# conftest.py มี custom collector ที่รันแต่ละสคริปต์เป็น subprocess (เหมือน run_ci.sh) →
# ปิด builtin python-collector ไม่ให้ "import" ไฟล์เหล่านี้ (กัน module-level sys.exit ครัช collection).
# ค่า python_files นี้จงใจไม่ match ไฟล์จริงตัวใด — ให้ conftest เป็นผู้ collect ทางเดียว.
python_files = ["_pytest_native_disabled_*.py"]
addopts = "-q -p no:cacheprovider"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# [ADR-194] สัญญา lint = "E4/E7/E9 + F" (error/pyflakes) — ต้อง "ประกาศชัด" ห้ามพึ่ง default ของ ruff
#   เดิมบรรทัดนี้เป็นคอมเมนต์ว่า "default (E,F)" แล้วปล่อยให้ ruff เลือกเอง. ruff เปลี่ยน default
#   ชุดกฎข้ามเวอร์ชัน: 0.16.1 เปิด ~413 กฎ (BLE/DTZ/UP/I/SIM/RUF/PIE ฯลฯ) → เกต [11] แดง 73 ข้อ
#   ทั้งที่ "โค้ดไม่ได้เปลี่ยน" = เกตวัดคนละอย่างกับที่ประกาศไว้ (ตระกูลเดียวกับ ADR-188:
#   ผลเกตขึ้นกับเครื่องมือที่ติดตั้ง ไม่ใช่ขึ้นกับโค้ด). ประกาศ select ตรง ๆ = สัญญาคงที่ทุกเวอร์ชัน.
#   หมายเหตุ: 73 ข้อนั้นเป็นกฎ "สไตล์/ทันสมัย" ที่โปรเจกต์ไม่เคยรับมาเป็นมาตรฐาน และบางข้อขัดกับ
#   ข้อตกลงของโปรเจกต์โดยตรง (UP009 สั่งลบ `# -*- coding: utf-8 -*-` ที่ทุกไฟล์ใช้กับข้อความไทย ;
#   DTZ001 สั่งใส่ tzinfo ทั้งที่ระบบตรึงวันที่ด้วย PUOPUY_AUDIT_DATE และทำงาน offline).
#   จะรับกฎเพิ่มเมื่อไรก็ได้ — แต่ต้อง "ตั้งใจเพิ่มใน select" ไม่ใช่ถูกเปิดให้เองตอนอัปเกรดเครื่องมือ.
select = ["E4", "E7", "E9", "F"]
[tool.ruff.lint.per-file-ignores]
# เทสเป็น script: ต้องตั้ง sys.path ก่อน import engine (E402), รวม import บรรทัดเดียว (E401),
# ชื่อสั้น l ในตัวช่วย (E741) — เป็น idiom ของ harness ไม่ใช่โค้ดส่งมอบ
"test_*.py" = ["E402", "E401", "E741"]

# ── mypy: บังคับ type เฉพาะ "ชั้น leaf utility" (self-contained, ไม่พึ่ง re-export chain) ──
# โค้ด parser/rules ใช้ dynamic re-export → mypy ทั้งก้อนจะ false-positive (undefined-name) เพียบ
# จึง scope การบังคับ type ไว้ที่ leaf layer ที่ type-check ได้จริง. test_typing_leaf.py ตรึงสัญญานี้
# (รัน mypy --disallow-untyped-defs บน 4 โมดูลนี้) และ GitHub CI บังคับจริง.
#   ใช้เอง:  mypy --ignore-missing-imports --disallow-untyped-defs puopuy_core.py puopuy_dates.py puopuy_units.py core_utils.py
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["puopuy_core.py", "puopuy_dates.py", "puopuy_units.py", "core_utils.py"]

[[tool.mypy.overrides]]
module = ["puopuy_core", "puopuy_dates", "puopuy_units", "core_utils"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
