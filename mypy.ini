[mypy]
strict = true
python_version = 3.12
mypy_path = src
explicit_package_bases = true
ignore_missing_imports = true
exclude = src/pandas_ta/

[mypy-pandas_ta.*]
ignore_errors = true

[mypy-infrastructure.web.api]
ignore_errors = true

[mypy-orchestration.runtime]
disable_error_code = arg-type,assignment,attr-defined,unused-ignore

[mypy-orchestration.agents.spec]
ignore_errors = true

[mypy-orchestration.agents.ceo_agent]
disable_error_code = attr-defined

[mypy-domain.events]
ignore_errors = true

[mypy-domain.trading.paper]
ignore_errors = true

[mypy-domain.trading.orders]
ignore_errors = true

[mypy-domain.trading.market_data]
ignore_errors = true

[mypy-domain.strategy.base]
ignore_errors = true

[mypy-domain.shared.money]
ignore_errors = true

[mypy-domain.portfolio.treasury]
ignore_errors = true

[mypy-domain.portfolio.models]
ignore_errors = true

[mypy-domain.portfolio.engine]
ignore_errors = true

[mypy-domain.analytics.*]
ignore_errors = true

[mypy-domain.reporting.*]
ignore_errors = true

[mypy-domain.backtest.*]
ignore_errors = true

[mypy-domain.audit.*]
ignore_errors = true

[mypy-domain.risk.rules]
ignore_errors = true

[mypy-domain.risk.sizing]
ignore_errors = true

[mypy-domain.risk.fee_sizing]
ignore_errors = true

[mypy-infrastructure.config]
ignore_errors = true

[mypy-infrastructure.logging.*]
ignore_errors = true
