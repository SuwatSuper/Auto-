function guide(code){
  for(var i=0;i<DB.guides.length;i++) if(DB.guides[i].code===code) return DB.guides[i];
  return null;
}
function guideOfProduct(p){ return p&&p.guideCode?guide(p.guideCode):null; }
/* รายการที่ยังรอข้อมูลยืนยัน — แสดงในระบบเท่านั้น ไม่พิมพ์ลงเอกสารที่ส่งลูกค้า */
function guideTodoCount(){
  var n=0; DB.guides.forEach(function(g){ n+=(g.todo||[]).length; }); return n;
}

/* ---------------------------------------------------------------
   6. เอนจินคำนวณเอกสาร
   ลำดับการคำนวณ (มาตรฐานเอกสารการค้าไทย):
     1) มูลค่าแต่ละรายการ = จำนวน × ราคา/หน่วย − ส่วนลดรายการ
     2) รวมเป็นเงิน (subtotal)
     3) หักส่วนลดท้ายบิล  → ฐานภาษี (taxBase)
     4) ภาษีมูลค่าเพิ่ม   → เฉพาะเมื่อจด VAT แล้วเท่านั้น
     5) หัก ณ ที่จ่าย     → หักจากยอดก่อน VAT (ใช้กับงานบริการ)
     6) ยอดสุทธิที่ต้องชำระ
--------------------------------------------------------------- */
function lineAmount(it){
  var gross=num(it.qty)*num(it.price);
  var disc = it.discType==='pct' ? gross*num(it.disc)/100 : num(it.disc);
  return r2(Math.max(0,gross-disc));
}
function calcDoc(d){
  var sub=0;
  (d.items||[]).forEach(function(it){ sub+=lineAmount(it); });
  sub=r2(sub);
  var billDisc = d.discType==='pct' ? r2(sub*num(d.disc)/100) : r2(num(d.disc));
  billDisc=Math.min(billDisc,sub);
  var taxBase=r2(sub-billDisc);
  var vatRate = d.vat ? num(d.vatRate) : 0;
  var vat = r2(taxBase*vatRate/100);
  var wht = d.wht ? r2(taxBase*num(d.whtRate)/100) : 0;
  var grand=r2(taxBase+vat);
  var payable=r2(grand-wht);
  return {sub:sub, billDisc:billDisc, taxBase:taxBase, vatRate:vatRate,
          vat:vat, wht:wht, grand:grand, payable:payable};
}

/* ---------------------------------------------------------------
   7. เอนจินสต็อก
   หลักการ: สต็อกเปลี่ยนได้ทางเดียวคือผ่าน "ใบเคลื่อนไหว" (moves)
   ยอดคงเหลือของสินค้า = ผลรวมของ moves เสมอ ทำให้ตรวจสอบย้อนหลังได้
   และแก้ปัญหาตัดสต็อกซ้ำซ้อนได้ด้วย refId
--------------------------------------------------------------- */
function recomputeStock(){
  var map={};
  DB.products.forEach(function(p){ map[p.id]=0; });
  DB.moves.forEach(function(m){
    if(map[m.productId]===undefined) map[m.productId]=0;
    map[m.productId]+=num(m.qty);
  });
  DB.products.forEach(function(p){ p.stock=r2(map[p.id]||0); });
}
function addMove(productId,qty,kind,refId,refNo,note,dateIso){
  DB.moves.push({id:uid('mv'), date:dateIso||today(), productId:productId,
    qty:r2(qty), kind:kind, refId:refId||'', refNo:refNo||'', note:note||'',
    at:new Date().toISOString()});
}
function removeMovesOf(refId){
  DB.moves=DB.moves.filter(function(m){ return m.refId!==refId; });
}

/* เอกสารนี้ทำให้สต็อกเคลื่อนไหวแล้วหรือยัง
   รองรับกรณีที่สถานะเดินต่อไปหลังส่งของ เช่น ใบส่งตัวอย่างที่เปลี่ยนเป็น
   “ติดตามผลแล้ว” — ของออกจากคลังไปแล้วจริง จึงต้องไม่คืนสต็อก */
function isPosted(d){
  var p=POSTED[d.type]; if(!p) return false;
  if(d.status===p) return true;
  return (POSTED_AFTER[d.type]||[]).indexOf(d.status)>=0;
}
/* ชื่อประเภทการเคลื่อนไหวที่บันทึกลงประวัติสต็อก */
function moveKind(type){
  if(type==='SM') return 'จ่ายตัวอย่าง';
  return DOCTYPE[type].stock==='out' ? 'ขายออก' : 'รับเข้า';
}

/* ปรับ moves ให้ตรงกับสถานะเอกสารปัจจุบัน (idempotent) */
/* ใบลดหนี้ที่ออกเพราะลดราคา (ไม่ได้รับของคืน) ต้องไม่เพิ่มสต็อก
   เอกสารเดิมไม่มีฟิลด์นี้ ถือว่ารับของคืนเหมือนพฤติกรรมเดิม */
function movesStock(d){
  var t=DOCTYPE[d.type];
  if(!t || t.stock==='none') return false;
  if(d.type==='CN' && d.returnStock===false) return false;
  return true;
}
function syncDocStock(d){
  var t=DOCTYPE[d.type];
  removeMovesOf(d.id);
  if(isPosted(d) && movesStock(d)){
    var sign = t.stock==='out' ? -1 : 1;
    (d.items||[]).forEach(function(it){
      if(!it.productId) return;                    // รายการอิสระ ไม่ผูกสินค้า → ไม่แตะสต็อก
      addMove(it.productId, sign*num(it.qty),
        moveKind(d.type), d.id, d.no,
        t.th+' '+d.no, d.date);
    });
  }
  recomputeStock();
}

/* ตรวจว่าถ้าโพสต์เอกสารนี้แล้วสต็อกจะติดลบหรือไม่ */
function stockShortage(d){
  if(DOCTYPE[d.type].stock!=='out') return [];
  var need={};
  (d.items||[]).forEach(function(it){
    if(!it.productId) return;
    need[it.productId]=(need[it.productId]||0)+num(it.qty);
  });
  var already={};
  DB.moves.forEach(function(m){ if(m.refId===d.id) already[m.productId]=(already[m.productId]||0)+num(m.qty); });
  var out=[];
  for(var pid in need){
    var p=product(pid); if(!p) continue;
    var have=num(p.stock)-num(already[pid]||0);   // ยอดก่อนตัดของเอกสารนี้
    if(need[pid]>have) out.push({product:p, need:need[pid], have:r2(have), short:r2(need[pid]-have)});
  }
  return out;
}

/* ---------------------------------------------------------------
   8. บันทึก / ลบ / แปลงเอกสาร
--------------------------------------------------------------- */
function newDoc(type,preset){
  var t=DOCTYPE[type], dt=today();
  var pk=peekDocNo(type,dt);
  var lang=normLang(DB.settings.docLang);
  var d={
    id:uid('doc'), type:type, no:pk.no, _bucket:pk.bucket, _seq:pk.n,
    lang:lang,
    date:dt, dueDate:defaultDueDays(type)?addDays(dt,defaultDueDays(type)):'',
    partyId:'', partyKind:(t.dir==='in'?'supplier':'customer'),
    partySnapshot:null,
    poRef:'', contactRef:'',
    items:[], disc:0, discType:'thb',
    // เอกสารไม่คิดมูลค่าไม่มีฐานภาษี จึงไม่ผูก VAT ไว้ตั้งแต่ต้น
    vat:(!t.noPrice && !!DB.company.vatRegistered), vatRate:num(DB.company.vatRate)||7,
    wht:false, whtRate:3,
    note:defaultTerms(type,lang),
    payMethod:'', payRef:'', payDate:'',
    status:STATUS[type][0].k,
    createdAt:new Date().toISOString()
  };
  if(preset) for(var k in preset) d[k]=preset[k];
  return d;
}
/* จำนวนวันตั้งต้นของวันครบกำหนด — ใบเสนอราคาและใบส่งตัวอย่างตั้งได้ที่หน้าตั้งค่า */
function defaultDueDays(type){
  var s=DB.settings||{}, t=DOCTYPE[type];
  if(type==='QT' && s.quoteValidDays!==undefined && s.quoteValidDays!=='') return num(s.quoteValidDays);
  if(type==='SM' && s.sampleFollowDays!==undefined && s.sampleFollowDays!=='') return num(s.sampleFollowDays);
  return t.validDays;
}
/* ข้อความมาตรฐานตามชนิดเอกสารและภาษา
   ถ้าช่องภาษาอังกฤษยังว่าง จะถอยไปใช้ข้อความภาษาไทย ดีกว่าพิมพ์เอกสารออกมาโล่ง */
function defaultTerms(type,lang){
  var s=DB.settings, en=(normLang(lang)==='en');
  function pick(k){ var v=en?s[k+'En']:''; return (v&&String(v).trim())?v:(s[k]||''); }
  if(type==='SM') return pick('sampleTerms');
  if(type==='QT') return pick('quoteTerms');
  if(type==='DN') return pick('deliveryTerms');
  if(type==='IV'||type==='BN') return pick('invoiceTerms');
  return '';
}
/* ข้อความปัจจุบันยังเป็นข้อความมาตรฐานอยู่หรือไม่ (ยังไม่ถูกผู้ใช้แก้เอง)
   ใช้ตัดสินว่าเปลี่ยนภาษาแล้วสลับข้อความให้อัตโนมัติได้หรือไม่ */
function isDefaultTerms(type,note){
  var t=String(note==null?'':note);
  return t.trim()==='' || t===defaultTerms(type,'th') || t===defaultTerms(type,'en');
}
var LAST_LINKED=[];   // เอกสารต้นทางที่ถูกปรับสถานะอัตโนมัติจากการบันทึกครั้งล่าสุด
function saveDoc(d){
  var i=DB.docs.findIndex(function(x){ return x.id===d.id; });
  // ผูกข้อมูลคู่ค้า ณ เวลาออกเอกสาร เพื่อให้เอกสารเก่าไม่เปลี่ยนตามการแก้ไขทะเบียนลูกค้า
  var party = d.partyKind==='supplier' ? supplier(d.partyId) : customer(d.partyId);
  if(party) d.partySnapshot=JSON.parse(JSON.stringify(party));
  d.updatedAt=new Date().toISOString();
  if(i<0) DB.docs.push(d); else DB.docs[i]=d;
  if(d._bucket) commitDocNo(d._bucket,d._seq);
  syncDocStock(d);
  LAST_LINKED=syncPaymentFor(d);
  save();
  return d;
}
function deleteDoc(id){
  var old=doc(id);
  removeMovesOf(id);
  DB.docs=DB.docs.filter(function(x){ return x.id!==id; });
  if(old) syncPaymentFor(old);
  recomputeStock(); save();
}

/* แปลงเอกสารต่อสาย เช่น ใบเสนอราคา → ใบส่งของ → ใบแจ้งหนี้ → ใบเสร็จ */
var CONVERT={SM:['QT'], QT:['SM','DN','IV'], DN:['IV','RC'], IV:['RC','BN','CN'], BN:['RC'], PO:[], RC:[], CN:[]};
function convertDoc(src,toType){
  var d=newDoc(toType);
  d.partyId=src.partyId; d.partyKind=src.partyKind; d.partySnapshot=src.partySnapshot;
  d.items=JSON.parse(JSON.stringify(src.items||[]));
  d.disc=src.disc; d.discType=src.discType;
  d.vat=src.vat; d.vatRate=src.vatRate; d.wht=src.wht; d.whtRate=src.whtRate;
  d.poRef=src.poRef; d.contactRef=src.contactRef;
  d.fromId=src.id; d.fromNo=src.no; d.fromType=src.type;
  /* ภาษาเอกสารต้องสืบทอดตามสายงาน ลูกค้าต่างชาติที่ได้ใบเสนอราคาอังกฤษ
     ต้องได้ใบส่งของและใบแจ้งหนี้เป็นภาษาอังกฤษต่อเนื่องกันทั้งชุด */
  d.lang=normLang(src.lang);
  d.note=defaultTerms(toType,d.lang);

  /* ราคาในเอกสารตัวอย่างคือ "ต้นทุน" ไม่ใช่ราคาขาย จึงต้องตั้งราคาใหม่จากทะเบียนสินค้า
     ทุกครั้งที่แปลงข้ามระหว่างเอกสารคิดเงินกับเอกสารไม่คิดเงิน กันราคาทุนหลุดไปถึงลูกค้า */
  var srcNoPrice=!!DOCTYPE[src.type].noPrice, dstNoPrice=!!DOCTYPE[toType].noPrice;
  if(srcNoPrice!==dstNoPrice){
    d.items.forEach(function(it){
      var p=it.productId?product(it.productId):null;
      it.price = p ? (dstNoPrice?num(p.cost):num(p.price)) : 0;
      it.disc=0; it.discType='thb';
    });
    d.disc=0; d.discType='thb';
  }
  if(dstNoPrice){ d.vat=false; d.wht=false; }
  if(toType==='IV'||toType==='BN'){
    var days=(customer(src.partyId)||{}).creditDays||DB.settings.defaultCreditDays||0;
    d.dueDate=addDays(d.date,days);
  }
  if(toType==='RC'){ d.payDate=today(); d.status='issued'; }
  return d;
}

/* ---------------------------------------------------------------
   9. รายงาน / ตัวเลขสรุป
--------------------------------------------------------------- */
function docTotal(d){ return calcDoc(d).payable; }

/* ---- ลูกหนี้ ----
   ยอดค้างของใบแจ้งหนี้ = ยอดเอกสาร − ใบเสร็จที่ออกแล้ว − ใบลดหนี้ที่ออกแล้ว
   (ใบเสร็จที่ออกผ่านใบวางบิลของใบแจ้งหนี้นั้นนับรวมด้วย) รองรับการรับชำระบางส่วน
   ใบวางบิลที่สร้างจากใบแจ้งหนี้ คือการทวงหนี้ก้อนเดียวกัน จึงนับลูกหนี้ที่ใบแจ้งหนี้ใบเดียว
   (เดิมนับทั้งสองใบ ยอดลูกหนี้จึงเพิ่มเป็นสองเท่าเมื่อออกใบวางบิล) */
function settlementIndex(){
  var bnOf={}, paid={}, credit={};
  DB.docs.forEach(function(x){ if(x.type==='BN' && x.fromId) bnOf[x.id]=x.fromId; });
  function add(m,id,v){ m[id]=(m[id]||0)+v; }
  DB.docs.forEach(function(x){
    if(x.status!=='issued' || !x.fromId) return;
    if(x.type==='RC'){
      var v=docTotal(x);
      add(paid,x.fromId,v);
      if(bnOf[x.fromId]) add(paid,bnOf[x.fromId],v);
    }else if(x.type==='CN'){
      add(credit,x.fromId,docTotal(x));
    }
  });
  return {paid:paid, credit:credit};
}
function docOutstanding(d,idx){
  idx=idx||settlementIndex();
  return r2(Math.max(0, docTotal(d)-(idx.paid[d.id]||0)-(idx.credit[d.id]||0)));
}
function billsInvoice(d){
  if(d.type!=='BN' || !d.fromId) return false;
  var src=doc(d.fromId);
  return !!(src && src.type==='IV' && src.status!=='void' && src.status!=='draft');
}
function openAR(idx){                   // ลูกหนี้คงค้าง
  idx=idx||settlementIndex();
  return DB.docs.filter(function(d){
    var st=AR_OPEN[d.type];
    if(!st || st.indexOf(d.status)<0) return false;
    if(billsInvoice(d)) return false;
    return docOutstanding(d,idx)>0.005;
  });
}
/* ใบเสร็จ/ใบลดหนี้ที่ตัดยอดครบ: ปรับใบแจ้งหนี้ (และใบวางบิล) ต้นทางเป็น “รับชำระแล้ว” ให้อัตโนมัติ
   และย้อนกลับเป็น “วางบิลแล้ว” เมื่อใบเสร็จถูกยกเลิก/ลบ — ย้อนเฉพาะสถานะที่ระบบปรับเอง
   ไม่แตะสถานะที่ผู้ใช้ตั้งด้วยมือ คืนรายการเอกสารที่ถูกปรับเพื่อแจ้งผู้ใช้ */
function syncPaymentFor(d){
  if(!d || (d.type!=='RC' && d.type!=='CN') || !d.fromId) return [];
  var src=doc(d.fromId); if(!src) return [];
  var targets=[src];
  if(billsInvoice(src)) targets.push(doc(src.fromId));
  var idx=settlementIndex(), changed=[];
  targets.forEach(function(x){
    if(!x || (x.type!=='IV' && x.type!=='BN')) return;
    var settled=(idx.paid[x.id]||0)+(idx.credit[x.id]||0);
    var out=docOutstanding(x,idx);
    if(x.status==='sent' && settled>0 && out<=0.005){ x.status='paid'; x.autoPaid=true; changed.push(x); }
    else if(x.status==='paid' && x.autoPaid && out>0.005){ x.status='sent'; delete x.autoPaid; changed.push(x); }
  });
  return changed;
}
function arAging(){
  var t=today(), b={cur:0,d30:0,d60:0,d90:0,d90p:0,total:0}, rows=[];
  var idx=settlementIndex();
  openAR(idx).forEach(function(d){
    var amt=docOutstanding(d,idx);
    var due=d.dueDate||d.date;
    var over=daysBetween(due,t);
    var slot = over<=0?'cur' : over<=30?'d30' : over<=60?'d60' : over<=90?'d90':'d90p';
    b[slot]+=amt; b.total+=amt;
    rows.push({doc:d, amt:amt, over:over, slot:slot});
  });
  for(var k in b) b[k]=r2(b[k]);
  rows.sort(function(a,c){ return c.over-a.over; });
  return {buckets:b, rows:rows};
}
function salesInMonth(ym){              // ym = 'YYYY-MM'
  var total=0, n=0;
  DB.docs.forEach(function(d){
    if(d.type!=='DN' || d.status!=='delivered') return;
    if(d.date.slice(0,7)!==ym) return;
    total+=docTotal(d); n++;
  });
  return {total:r2(total), count:n};
}
function stockValue(){
  var v=0; DB.products.forEach(function(p){ v+=num(p.stock)*num(p.cost); }); return r2(v);
}
function lowStock(){
  return DB.products.filter(function(p){
    return p.active && num(p.minStock)>0 && num(p.stock)<=num(p.minStock);
  }).sort(function(a,b){ return (a.stock-a.minStock)-(b.stock-b.minStock); });
}
function topProducts(limit){
  var m={};
  DB.docs.forEach(function(d){
    if(d.type!=='DN'||d.status!=='delivered') return;
    (d.items||[]).forEach(function(it){
      if(!it.productId) return;
      if(!m[it.productId]) m[it.productId]={qty:0,amt:0};
      m[it.productId].qty+=num(it.qty);
      m[it.productId].amt+=lineAmount(it);
    });
  });
  var rows=[];
  for(var pid in m){ var p=product(pid); if(p) rows.push({p:p,qty:r2(m[pid].qty),amt:r2(m[pid].amt)}); }
  rows.sort(function(a,b){ return b.amt-a.amt || b.qty-a.qty; });
  return limit?rows.slice(0,limit):rows;
}
function monthlySeries(months){
  var out=[], d=new Date();
  d.setDate(1);
  for(var i=months-1;i>=0;i--){
    var x=new Date(d.getFullYear(), d.getMonth()-i, 1);
    var ym=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0');
    var s=salesInMonth(ym);
    out.push({ym:ym, label:TH_MONTH_S[x.getMonth()]+' '+String(x.getFullYear()+543).slice(2),
              total:s.total, count:s.count});
  }
  return out;
}
/* ---- ใบส่งตัวอย่าง: ต้นทุนและการติดตามผล ----
   ตัวอย่างไม่ใช่ยอดขาย แต่เป็นค่าใช้จ่ายการตลาด จึงแยกรายงานออกจากยอดขาย
   มูลค่าที่ใช้คือ "ราคาทุน" ที่บันทึกไว้ในเอกสาร ไม่ใช่ราคาขาย            */
function sampleDocs(){
  return DB.docs.filter(function(d){ return d.type==='SM' && d.status!=='void' && d.status!=='draft'; });
}
function sampleCost(ym){
  var total=0, n=0;
  sampleDocs().forEach(function(d){
    if(ym && d.date.slice(0,7)!==ym) return;
    total+=calcDoc(d).sub; n++;
  });
  return {total:r2(total), count:n};
}
/* ตัวอย่างที่ถึงกำหนดติดตามผลแล้วแต่ยังไม่ได้ติดตาม */
function samplesDueFollowUp(){
  var t=today();
  return DB.docs.filter(function(d){
    return d.type==='SM' && d.status==='delivered' && d.dueDate && d.dueDate<=t;
  }).sort(function(a,b){ return (a.dueDate||'').localeCompare(b.dueDate||''); });
}
/* อัตราการปิดการขายจากตัวอย่างที่ส่งไปแล้ว */
function sampleConversion(){
  var closed=0, won=0;
  DB.docs.forEach(function(d){
    if(d.type!=='SM') return;
    if(d.status==='won'){ won++; closed++; }
    else if(d.status==='lost') closed++;
  });
  return {won:won, closed:closed, pct: closed?r2(won/closed*100):0};
}

function customerStats(cid){
  var sales=0, docs=0, last='';
  DB.docs.forEach(function(d){
    if(d.partyId!==cid) return;
    if(d.type==='DN'&&d.status==='delivered'){ sales+=docTotal(d); docs++; if(d.date>last) last=d.date; }
  });
  var due=0, idx=settlementIndex();
  openAR(idx).forEach(function(d){ if(d.partyId===cid) due+=docOutstanding(d,idx); });
  var samples=DB.docs.filter(function(d){
    return d.type==='SM' && d.partyId===cid && d.status!=='draft' && d.status!=='void'; }).length;
  return {sales:r2(sales), docs:docs, last:last, due:r2(due), samples:samples};
}

/* ---------------------------------------------------------------
   10. ตัวสร้างกระดาษเอกสาร A4
   ข้อกำหนดตามกฎหมายไทยที่ระบบบังคับให้เอง:
   - หากยังไม่จดทะเบียนภาษีมูลค่าเพิ่ม จะไม่พิมพ์คำว่า "ใบกำกับภาษี"
     และไม่แสดงบรรทัด VAT เด็ดขาด (ป.รัษฎากร ม.86 ห้ามผู้ไม่จด VAT
     ออกใบกำกับภาษี มีโทษตามกฎหมาย)
   - เมื่อจด VAT แล้ว ใบส่งของและใบเสร็จจะเติมคำว่า "/ ใบกำกับภาษี"
     และแสดงเลขประจำตัวผู้เสียภาษีทั้งฝั่งผู้ขายและผู้ซื้อ
--------------------------------------------------------------- */
var LOGO_SVG='<svg width="34" height="40" viewBox="0 0 100 118" fill="none" xmlns="http://www.w3.org/2000/svg">'+
 '<path d="M50 6c14 20 27 33 27 48a27 27 0 1 1-54 0C23 39 36 26 50 6z" stroke="currentColor" stroke-width="4" fill="none"/>'+
 '<path d="M44 84V52a9 9 0 1 1 9 9h-9" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>'+
 '<ellipse cx="50" cy="90" rx="44" ry="15" stroke="currentColor" stroke-width="3.4" fill="none"/>'+
 '<ellipse cx="50" cy="90" rx="28" ry="9" stroke="currentColor" stroke-width="3" fill="none"/></svg>';

/* ใบกำกับภาษี: หนึ่งการขายออกได้ใบเดียว (ป.รัษฎากร ม.86 และ ม.86/13)
   เดิมเมื่อจด VAT ระบบพิมพ์คำว่า “ใบกำกับภาษี” ทั้งบนใบส่งของ ใบแจ้งหนี้ และใบเสร็จของการขายเดียวกัน
   กติกาใหม่: เอกสารใบแรกในสายงานที่เป็นใบส่งของ ใบแจ้งหนี้ หรือใบเสร็จ คือใบกำกับภาษี
   (ขายเชื่อส่งของก่อน → ใบส่งของ · วางบิลโดยไม่มีใบส่งของ → ใบแจ้งหนี้ · ขายสด → ใบเสร็จ)
   เอกสารที่สร้างต่อจากใบนั้นไม่พิมพ์คำว่าใบกำกับภาษีซ้ำ ถ้าใบกำกับภาษีต้นทางถูกยกเลิก ใบถัดไปจะเป็นใบกำกับภาษีแทน
   ใบลดหนี้คงรูปแบบเดิม (เป็นเอกสารแยกตาม ม.86/10) */
var TAX_DOC={DN:1,IV:1,RC:1};
function taxInvoiceSource(d){
  var seen={}, cur=d;
  while(cur && cur.fromId && !seen[cur.fromId]){
    seen[cur.fromId]=1;
    var src=doc(cur.fromId);
    if(!src) return TAX_DOC[cur.fromType] ? {no:cur.fromNo, type:cur.fromType} : null;
    /* นับรวมฉบับร่างด้วย: ร่างที่ออกภายหลังจะกลายเป็นใบกำกับภาษี จึงต้องกันไว้ไม่ให้เกิดสองใบ */
    if(TAX_DOC[src.type] && src.status!=='void') return src;
    cur=src;
  }
  return null;
}
function isTaxInvoice(d){
  if(!DB.company.vatRegistered || !TAX_DOC[d.type]) return false;
  return !taxInvoiceSource(d);
}
function docTitleTh(d){
  var t=DOCTYPE[d.type];
  var vatCo=DB.company.vatRegistered;
  if(TAX_DOC[d.type]) return isTaxInvoice(d) ? t.th+' / ใบกำกับภาษี' : t.th;
  if(d.type==='CN') return vatCo ? 'ใบลดหนี้ / ใบกำกับภาษี' : 'ใบลดหนี้';
  return t.th;
}
function docTitleEn(d){
  var t=DOCTYPE[d.type], vatCo=DB.company.vatRegistered;
  if(TAX_DOC[d.type]) return isTaxInvoice(d) ? t.en+' / TAX INVOICE' : t.en;
  if(vatCo && d.type==='CN') return t.en+' / TAX INVOICE';
  return t.en;
}
/* ภาษาหลักอยู่บรรทัดใหญ่ ภาษารองอยู่บรรทัดเล็กใต้ลงมา
   เอกสารภาษาอังกฤษยังคงพิมพ์ชื่อไทยกำกับไว้ เพื่อให้ใช้เป็นหลักฐานทางบัญชีในไทยได้ */
function docTitleMain(d){ return normLang(d.lang)==='en' ? docTitleEn(d) : docTitleTh(d); }
function docTitleSub(d){  return normLang(d.lang)==='en' ? docTitleTh(d) : docTitleEn(d); }

/* บล็อกคู่ค้า — ส่ง lang เมื่อต้องการภาษาอังกฤษ
   หน้าจอภายในทุกหน้าเรียกโดยไม่ส่ง lang จึงยังเป็นภาษาไทยเหมือนเดิมทั้งหมด */
function partyBlock(d,lang){
  lang=normLang(lang);
  var p=d.partySnapshot || (d.partyKind==='supplier'?supplier(d.partyId):customer(d.partyId));
  if(!p) return {name:TT(lang, d.partyKind==='supplier'?'noSupplier':'noCustomer'), lines:[]};
  var lines=[];
  var branch=fx(lang,p,'branch','branchEn');
  if(branch) lines.push(TT(lang,'branchPfx')+branch);
  var a1=fx(lang,p,'addr1','addrEn1'), a2=fx(lang,p,'addr2','addrEn2');
  if(a1) lines.push(a1);
  if(a2) lines.push(a2);
  if(p.taxId) lines.push(TT(lang,'taxIdPfx')+p.taxId);
  var l4=[];
  if(p.contact) l4.push(TT(lang,'contactPfx')+p.contact);
  if(p.phone) l4.push(TT(lang,'telPfx')+p.phone);
  if(l4.length) lines.push(l4.join('  ·  '));
  if(p.email) lines.push(p.email);
  return {name:fx(lang,p,'name','nameEn'), lines:lines};
}

/* ส่วนประกอบของกระดาษเอกสาร แยกเป็นชิ้นเพื่อให้ตัวจัดหน้าประกอบได้ทั้งแบบหน้าเดียวและหลายหน้า
   ข้อความ ตัวเลข และกฎภาษีบนกระดาษคงเดิมทุกอย่าง ต่างกันเพียงวิธีประกอบเป็นหน้า */
function sheetParts(d,copyLabel,langOverride){
  var c=DB.company, t=DOCTYPE[d.type], m=calcDoc(d);
  /* langOverride ใช้ตอนดูตัวอย่างก่อนพิมพ์เท่านั้น ไม่แตะข้อมูลที่บันทึกไว้ */
  var lang=normLang(langOverride||d.lang);
  var L=function(k){ return TT(lang,k); };
  var dEff=(lang===normLang(d.lang))?d:(function(){ var x={}; for(var k in d) x[k]=d[k]; x.lang=lang; return x; })();
  var party=partyBlock(d,lang);
  var vatCo=!!c.vatRegistered;
  var en=(lang==='en');

  /* --- หัวกระดาษ: ผู้ประกอบการ --- */
  var coMain = en ? (c.nameEn||c.nameTh) : c.nameTh;
  var coSub  = en ? c.nameTh : (c.nameEn||'');
  var coMeta=[];
  var ca1=fx(lang,c,'addr1','addrEn1'), ca2=fx(lang,c,'addr2','addrEn2');
  coMeta.push(ca1||''); if(ca2) coMeta.push(ca2);
  var line3=[];
  if(c.phone) line3.push(L('telPfx')+c.phone);
  if(c.line) line3.push(L('linePfx')+c.line);
  if(c.email) line3.push(c.email);
  if(line3.length) coMeta.push(line3.join('  ·  '));
  var line4=[];
  if(vatCo && c.taxId){
    line4.push(L('taxIdPfx')+c.taxId);
    var cb=fx(lang,c,'branch','branchEn');
    if(cb) line4.push('('+cb+')');            // ใบกำกับภาษีต้องระบุสำนักงานใหญ่/สาขาของผู้ขาย
  }
  else if(c.regNo) line4.push(L('regNoPfx')+c.regNo);
  if(line4.length) coMeta.push(line4.join('  '));

  var logoHTML = c.logo
    ? '<img src="'+esc(c.logo)+'" alt="" style="width:15mm;height:auto;flex:0 0 auto">'
    : '<span style="flex:0 0 auto;color:#000">'+LOGO_SVG+'</span>';

  /* --- ข้อมูลเอกสารด้านขวา --- */
  var DT=function(iso,style){ return fmtDate(lang,iso,style); };
  var facts=[[L('docNo'), d.no], [L('docDate'), DT(d.date,'short')]];
  if(d.type==='SM') facts.push([L('followUp'), d.dueDate?DT(d.dueDate,'short'):'-']);
  if(d.type==='QT') facts.push([L('validUntil'), d.dueDate?DT(d.dueDate,'short'):'-']);
  if(d.type==='IV'||d.type==='BN') facts.push([L('dueDate'), d.dueDate?DT(d.dueDate,'short'):'-']);
  if(d.type==='RC'&&d.payDate) facts.push([L('payDate'), DT(d.payDate,'short')]);
  if(d.poRef) facts.push([L('poRef'), d.poRef]);
  if(d.fromNo){
    var ft=DOCTYPE[d.fromType];
    facts.push([L('refPfx')+(ft?(en?ft.en:ft.th):''), d.fromNo]);
  }
  if(d.contactRef) facts.push([L('contactRef'), d.contactRef]);
  facts.push([L('issuedBy'), fx(lang,c,'owner','ownerEn')||'']);

  /* --- รายการสินค้า ---
     เอกสารที่ไม่คิดมูลค่า (ใบส่งตัวอย่าง) ใช้ชุดคอลัมน์คนละชุด
     ตัดคอลัมน์ราคา ส่วนลด และจำนวนเงินออกทั้งหมด แล้วแทนด้วย
     ขนาดบรรจุกับอัตราการเจือจาง ซึ่งเป็นข้อมูลที่ผู้รับตัวอย่างต้องใช้จริง */
  var noPrice=!!t.noPrice;
  var rows=[], amounts=[], cols=noPrice?6:7;
  (d.items||[]).forEach(function(it,i){
    var p=it.productId?product(it.productId):null;
    var nm=fxItem(lang,it,p,'name','nameEn');
    var pk=fxItem(lang,it,p,'pack','packEn');
    var un=fxItem(lang,it,p,'unit','unitEn');
    if(noPrice){
      var dil=fxItem(lang,it,p,'dilution','dilutionEn')||'—';
      rows.push('<tr class="it-row">'+
        '<td class="c-no">'+(i+1)+'</td>'+
        '<td><div class="it-name">'+esc(nm)+'</div>'+
          ((it.sku||(p&&p.sku))?'<div class="it-sub">'+esc(it.sku||p.sku)+'</div>':'')+
          (it.note?'<div class="it-sub">'+esc(it.note)+'</div>':'')+'</td>'+
        '<td class="c-pack">'+esc(pk||'')+'</td>'+
        '<td class="c-qty">'+qtyFmt(it.qty)+'</td>'+
        '<td class="c-unit">'+esc(un||'')+'</td>'+
        '<td class="c-dil">'+esc(dil)+'</td></tr>');
      amounts.push(0);
      return;
    }
    var sub=[];
    if(it.sku||(p&&p.sku)) sub.push(it.sku||p.sku);
    if(pk) sub.push(pk);
    var dil2=fxItem(lang,it,p,'dilution','dilutionEn');
    if(it.dilution&&dil2) sub.push(dilLabel(lang,dil2));
    var discTxt = num(it.disc)>0 ? (it.discType==='pct'? money(it.disc,2)+'%' : money(it.disc,2)) : '-';
    rows.push('<tr class="it-row">'+
      '<td class="c-no">'+(i+1)+'</td>'+
      '<td><div class="it-name">'+esc(nm)+'</div>'+
        (sub.length?'<div class="it-sub">'+esc(sub.join('  ·  '))+'</div>':'')+
        (it.note?'<div class="it-sub">'+esc(it.note)+'</div>':'')+'</td>'+
      '<td class="c-qty">'+qtyFmt(it.qty)+'</td>'+
      '<td class="c-unit">'+esc(un||'')+'</td>'+
      '<td class="c-price">'+money(it.price)+'</td>'+
      '<td class="c-disc">'+discTxt+'</td>'+
      '<td class="c-amt">'+money(lineAmount(it))+'</td></tr>');
    amounts.push(lineAmount(it));
  });
  var emptyRow='<tr><td colspan="'+cols+'" style="text-align:center;padding:14px;font-size:10px">'+esc(L('noItems'))+'</td></tr>';
  // บรรทัดว่างเติมตารางให้เต็มหน้าแบบฟอร์มทางการ (ใช้เฉพาะเอกสารหน้าเดียว)
  // ระบบจัดหน้าอัตโนมัติ (fitSheet) จะตัดบรรทัดที่เกินออกเองเมื่อวางลงหน้าจอจริง
  var maxFill=noPrice?12:18;
  var fillerRow='<tr class="filler"><td class="c-no">&nbsp;</td><td></td>'+
    (noPrice?'<td class="c-pack"></td><td class="c-qty"></td><td class="c-unit"></td><td class="c-dil"></td>'
            :'<td class="c-qty"></td><td class="c-unit"></td><td class="c-price"></td><td class="c-disc"></td><td class="c-amt"></td>')+
    '</tr>';

  /* --- ยอดรวม --- */
  var tot='';
  tot+='<tr><td>'+esc(L('sumSub'))+'</td><td>'+money(m.sub)+'</td></tr>';
  if(m.billDisc>0) tot+='<tr><td>'+esc(L('sumDisc'))+(d.discType==='pct'?' '+money(d.disc,2)+'%':'')+'</td><td>('+money(m.billDisc)+')</td></tr>';
  if(m.billDisc>0) tot+='<tr><td>'+esc(vatCo?L('sumGoods'):L('sumAfterDisc'))+'</td><td>'+money(m.taxBase)+'</td></tr>';
  if(d.vat && vatCo) tot+='<tr><td>'+esc(L('sumVat'))+' '+money(m.vatRate,0)+'%</td><td>'+money(m.vat)+'</td></tr>';
  tot+='<tr class="grand"><td>'+esc(d.type==='RC'?L('sumGrandRc'):L('sumGrand'))+'</td><td>'+money(m.grand)+'</td></tr>';
  if(m.wht>0){
    tot+='<tr><td>'+esc(L('sumWht'))+' '+money(d.whtRate,0)+'%</td><td>('+money(m.wht)+')</td></tr>';
    tot+='<tr class="grand"><td>'+esc(L('sumNet'))+'</td><td>'+money(m.payable)+'</td></tr>';
  }

  /* --- บล็อกสรุปท้ายตาราง ---
     เอกสารคิดเงิน: จำนวนเงินเป็นตัวอักษร + ตารางยอดรวม
     ใบส่งตัวอย่าง: แถบ “ไม่คิดมูลค่า” + ช่องบันทึกผลการทดลองใช้ เพื่อให้ผู้รับ
     กรอกกลับมาได้ทันที ซึ่งเป็นข้อมูลที่ใช้ต่อยอดตอนโทรติดตามผล            */
  var sumHTML;
  if(noPrice){
    sumHTML='<div class="sh-nocharge">'+
      '<div class="nc-1">'+esc(L('ncTitle'))+'</div>'+
      '<div class="nc-2">'+esc(L('ncSub'))+'</div></div>'+
      '<div class="sh-fb"><div class="n-l">'+esc(L('fbTitle'))+'</div>'+
      '<div class="fb-line"></div><div class="fb-line"></div><div class="fb-line"></div></div>';
  }else{
    sumHTML='<div class="sh-sum">'+
      '<div class="sh-words"><div class="w-l">'+esc(L('wordsLbl'))+'</div>'+
        '<div class="w-v">( '+esc(moneyWords(lang, m.wht>0?m.payable:m.grand))+' )</div></div>'+
      '<div class="sh-tot"><table>'+tot+'</table></div></div>';
  }

  /* --- ช่องลงนาม --- */
  var signSet=LANG[lang].sign;
  var signs=signSet[d.type]||signSet._;
  var signHTML=signs.map(function(sg){
    var cap=String(sg[1]).replace('{co}', coMain);
    return '<div><div class="line"></div><div>'+esc(sg[0])+'</div><div class="cap">'+esc(cap)+'</div></div>';
  }).join('');

  /* --- ข้อมูลการชำระเงิน --- */
  var payHTML='';
  if(d.type==='RC'){
    var pm=[];
    if(d.payMethod) pm.push(L('payByPfx')+d.payMethod);
    if(d.payRef) pm.push(L('payRefPfx')+d.payRef);
    if(pm.length) payHTML='<div class="sh-pay">'+esc(pm.join('   ·   '))+'</div>';
  }else if((d.type==='IV'||d.type==='BN'||d.type==='QT') && c.bankAcctNo){
    var bkName=fx(lang,c,'bankName','bankNameEn');
    var bkBranch=fx(lang,c,'bankBranch','bankBranchEn');
    var bkAcct=fx(lang,c,'bankAcctName','bankAcctNameEn');
    payHTML='<div class="sh-pay"><b>'+esc(L('payTitle'))+'</b><br>'+
      esc(bkName)+(bkBranch?esc(L('payBranchPfx'))+esc(bkBranch):'')+'<br>'+
      esc(L('payAcctNamePfx'))+esc(bkAcct)+'  ·  '+esc(L('payAcctNoPfx'))+esc(c.bankAcctNo)+'</div>';
  }

  var partyLabel = d.partyKind==='supplier' ? L('supplierLbl') : L('customerLbl');
  var subCls = en ? ' l-th' : '';

  var title=docTitleMain(dEff), titleSub=docTitleSub(dEff);
  var partyShort=TT(lang, d.partyKind==='supplier'?'supplierShort':'partyShort');

  var thead='<thead><tr>'+
      (noPrice
        ? '<th class="c-no">'+esc(L('thNo'))+'</th><th>'+esc(L('thSample'))+'</th><th class="c-pack">'+esc(L('thPack'))+'</th>'+
          '<th class="c-qty">'+esc(L('thQty'))+'</th><th class="c-unit">'+esc(L('thUnit'))+'</th>'+
          '<th class="c-dil">'+esc(L('thDil'))+'</th>'
        : '<th class="c-no">'+esc(L('thNo'))+'</th><th>'+esc(L('thItem'))+'</th><th class="c-qty">'+esc(L('thQty'))+'</th>'+
          '<th class="c-unit">'+esc(L('thUnit'))+'</th><th class="c-price">'+esc(L('thPrice'))+'</th>'+
          '<th class="c-disc">'+esc(L('thDisc'))+'</th><th class="c-amt">'+esc(L('thAmount'))+'</th>')+
    '</tr></thead>';

  /* หัวกระดาษเต็ม (หน้าแรก) */
  var headFull=''+
    '<div class="sh-top">'+
      '<div class="sh-co">'+logoHTML+
        '<div><div class="sh-co-name">'+esc(coMain)+'</div>'+
          (coSub?'<div class="sh-co-en'+subCls+'">'+esc(coSub)+'</div>':'')+
          '<div class="sh-co-meta">'+coMeta.map(esc).join('<br>')+'</div></div></div>'+
      '<div class="sh-title"><h2>'+esc(title)+'</h2>'+
        '<div class="en'+subCls+'">'+esc(titleSub)+'</div>'+
        (copyLabel?'<div class="sh-copy">'+esc(copyLabel)+'</div>':'')+'</div>'+
    '</div>'+
    '<hr class="sh-rule">'+
    '<div class="sh-meta">'+
      '<div class="sh-party"><div class="sh-lbl">'+esc(partyLabel)+'</div>'+
        '<div class="sh-party-name">'+esc(party.name)+'</div>'+
        '<div class="sh-party-body">'+party.lines.map(esc).join('<br>')+'</div></div>'+
      '<div class="sh-facts"><div class="sh-lbl">'+esc(L('docDetail'))+'</div><table>'+
        facts.map(function(ff){ return '<tr><td>'+esc(ff[0])+'</td><td>'+esc(ff[1])+'</td></tr>'; }).join('')+
      '</table></div>'+
    '</div>';

  /* หัวกระดาษย่อ (หน้าที่ 2 เป็นต้นไป) — ยังระบุชื่อเอกสาร เลขที่ วันที่ คู่ค้า และเลขหน้าครบ
     เพื่อให้แต่ละแผ่นที่แยกออกจากกันยังรู้ว่าเป็นของเอกสารฉบับไหน */
  function headCont(pg,pages){
    return ''+
    '<div class="sh-top sh-top-c">'+
      '<div class="sh-co">'+
        '<div><div class="sh-co-name">'+esc(coMain)+'</div>'+
          (coSub?'<div class="sh-co-en'+subCls+'">'+esc(coSub)+'</div>':'')+'</div></div>'+
      '<div class="sh-title"><h2>'+esc(title)+' '+esc(L('contHead'))+'</h2>'+
        '<div class="en'+subCls+'">'+esc(titleSub)+'</div>'+
        (copyLabel?'<div class="sh-copy">'+esc(copyLabel)+'</div>':'')+'</div>'+
    '</div>'+
    '<hr class="sh-rule">'+
    '<div class="sh-cmeta"><span>'+esc(partyShort)+': <b>'+esc(party.name)+'</b></span>'+
      '<span>'+esc(L('docNo'))+' <b>'+esc(d.no)+'</b>  ·  '+esc(L('docDate'))+' '+esc(DT(d.date,'short'))+
        '  ·  '+esc(L('pageLbl'))+' '+pg+' / '+pages+'</span></div>';
  }

  var noteHTML=d.note?'<div class="sh-note"><div class="n-l">'+esc(L('noteLbl'))+'</div>'+esc(d.note).replace(/\n/g,'<br>')+'</div>':'';

  return {
    lang:lang, en:en, noPrice:noPrice, cols:cols,
    rows:rows, amounts:amounts, emptyRow:emptyRow, fillerRow:fillerRow, maxFill:maxFill,
    thead:thead, headFull:headFull, headCont:headCont,
    /* ส่วนท้ายเอกสาร: ยอดรวม ช่องทางชำระ หมายเหตุ ช่องลงนาม — อยู่หน้าสุดท้ายเท่านั้น */
    tail:sumHTML+payHTML+noteHTML+'<div class="sh-sign">'+signHTML+'</div>',
    contNext:'<div class="sh-cont">'+esc(L('contNext'))+' →</div>',
    open:function(pg,pages){
      return '<div class="sheet'+(en?' lang-en':'')+(pages>1?' paged':'')+'" data-doc="'+esc(d.no)+'" data-lang="'+lang+'"'+
        ' data-page="'+pg+'" data-pages="'+pages+'">';
    },
    foot:function(pg,pages){
      return '<div class="sh-foot"><span>'+esc(coMain)+'  ·  '+esc(title)+esc(L('footNoPfx'))+esc(d.no)+'</span>'+
        '<span>'+(pages>1?esc(L('pageLbl'))+' '+pg+' / '+pages+'  ·  ':'')+esc(L('printedOn'))+DT(today(),'short')+'</span></div>';
    },
    /* แถวยอดยกมา/ยอดยกไป ของเอกสารคิดเงินที่ยาวหลายหน้า */
    carryRow:function(kind,amount){
      return '<tr class="carry carry-'+kind+'"><td class="c-no"></td>'+
        '<td colspan="'+(cols-2)+'" class="cl">'+esc(L(kind==='in'?'carryIn':'carryOut'))+'</td>'+
        '<td class="c-amt">'+money(amount)+'</td></tr>';
    }
  };
}

/* ประกอบกระดาษหนึ่งหน้าจากส่วนประกอบ
   o = {first,last,from,to,fill,page,pages,carryIn,carryOut} */
function pageHTML(P,o){
  var body='';
  if(!P.rows.length) body+=P.emptyRow;
  if(o.carryIn!=null) body+=P.carryRow('in',o.carryIn);
  body+=P.rows.slice(o.from,o.to).join('');
  for(var f=0; f<(o.fill||0); f++) body+=P.fillerRow;
  if(o.carryOut!=null) body+=P.carryRow('out',o.carryOut);
  return P.open(o.page,o.pages)+
    (o.first?P.headFull:P.headCont(o.page,o.pages))+
    '<table class="sh-items">'+P.thead+'<tbody>'+body+'</tbody></table>'+
    '<div class="sh-fill"></div>'+
    (o.last?P.tail:P.contNext)+
    P.foot(o.page,o.pages)+
  '</div>';
}

/* กระดาษหน้าเดียวแบบเดิม (รวมบรรทัดว่างเติมหน้า) — ใช้ตรวจเนื้อหาและเป็นด่านแรกของการจัดหน้า */
function sheetHTML(d,copyLabel,langOverride){
  var P=sheetParts(d,copyLabel,langOverride), n=P.rows.length;
  return pageHTML(P,{first:true,last:true,from:0,to:n,fill:Math.max(0,P.maxFill-n),page:1,pages:1});
}

/* ---------------------------------------------------------------
   10a. ตัวจัดหน้ากระดาษ (Pagination engine)
   ปัญหาเดิม: เอกสารทั้งฉบับเป็นกระดาษแผ่นเดียวที่ยืดสูงเกิน A4 แล้วปล่อยให้เบราว์เซอร์
   ตัดหน้าเอง ผลคือหน้าที่ 2 ไม่มีหัวกระดาษ ไม่มีขอบบน รายการชิดขอบกระดาษ และแถวถูกตัดครึ่ง
   วิธีใหม่: กระดาษทุกแผ่นสูงคงที่ 1 หน้า A4 ระบบวัดความสูงจริงทีละแถว แล้วแบ่งรายการ
   ลงหน้าถัดไปเอง ทุกหน้ามีหัวกระดาษ เลขหน้า และยอดยกมา/ยกไป ส่วนยอดรวมและช่องลงนาม
   อยู่หน้าสุดท้ายเสมอ
--------------------------------------------------------------- */
var A4_PX=Math.round(297*96/25.4);   // 1123 พิกเซล (คงไว้ให้โค้ดภายนอกที่อ้างถึง)

/* เนื้อหาล้นกระดาษหรือไม่ — เทียบขอบล่างของท้ายกระดาษกับเส้นขอบล่างของพื้นที่พิมพ์
   ช่องว่าง .sh-fill ขยายดันท้ายกระดาษลงไปชิดเส้นนี้พอดีเมื่อเนื้อหาพอดีหน้า
   และหดได้ไม่ต่ำกว่าค่าต่ำสุดของมัน ท้ายกระดาษจึงเลยเส้นเฉพาะเมื่อเนื้อหาล้นจริง
   ระยะขอบล่างของกระดาษ (9–16 มม.) เป็นพื้นที่กันชนอีกชั้น เนื้อหาจึงไม่ถูกตัดแม้เครื่องพิมพ์ปัดเศษ
   คิดสัดส่วนการย่อของจอไว้ด้วย จึงวัดถูกแม้เวทีถูกย่อบนมือถือ */
function sheetOverflows(sh){
  var r=sh.getBoundingClientRect();
  if(!r.height) return false;                       // ไม่ได้แสดงบนจอ วัดไม่ได้
  var k=sh.offsetHeight ? r.height/sh.offsetHeight : 1;
  var pb=(parseFloat(getComputedStyle(sh).paddingBottom)||0)*k;
  var foot=sh.querySelector('.sh-foot');
  var bottom=foot ? foot.getBoundingClientRect().bottom : r.top+sh.scrollHeight*k;
  return (bottom-r.top) > (r.height-pb+0.5*k);
}

/* จัดกระดาษหน้าเดียว: 1) ตัดบรรทัดว่างส่วนเกิน 2) ถ้ายังไม่พอจึงลดความหนาแน่นตัวอักษร
   คืนค่า fit:false เมื่อเนื้อหายาวเกินหนึ่งหน้าจริง ให้ตัวแบ่งหน้าทำงานต่อ */
function fitSheet(sh){
  var fillers=[].slice.call(sh.querySelectorAll('tr.filler'));
  var tiers=['','dense','ultra'];
  sh.classList.remove('sheet-free');
  for(var t=0;t<tiers.length;t++){
    sh.classList.remove('dense','ultra');
    if(tiers[t]) sh.classList.add(tiers[t]);
    fillers.forEach(function(tr){ tr.style.display=''; });
    if(!sheetOverflows(sh)) return {tier:tiers[t]||'normal', fit:true};
    for(var k=fillers.length-1;k>=0;k--){
      fillers[k].style.display='none';
      if(!sheetOverflows(sh)) return {tier:tiers[t]||'normal', fit:true};
    }
  }
  return {tier:'ultra', fit:false};
}

function mountSheet(stage,html){
  var box=document.createElement('div');
  box.innerHTML=html;
  var sh=box.firstChild;
  stage.appendChild(sh);
  return sh;
}

/* วางแผนแบ่งหน้า: เติมแถวทีละแถวจนเต็มหน้า แล้วขึ้นหน้าใหม่
   หน้าสุดท้ายต้องมีที่พอสำหรับยอดรวม หมายเหตุ และช่องลงนาม
   ถ้าไม่พอ จะยกแถวท้ายสุดไปอยู่หน้าสุดท้ายด้วย (ไม่ปล่อยให้ยอดรวมอยู่หน้าเปล่าโดยไม่จำเป็น) */
function planPages(stage,P){
  var N=P.rows.length, plan=[], start=0, guard=0;
  function opts(first,last,from,to){
    return {first:first,last:last,from:from,to:to,page:99,pages:99,
      carryIn:(!P.noPrice&&!first)?0:null, carryOut:(!P.noPrice&&!last)?0:null};
  }
  while(guard++<5000){
    var first=!plan.length;
    var sh=mountSheet(stage,pageHTML(P,opts(first,true,start,N)));
    var fits=!sheetOverflows(sh);
    stage.removeChild(sh);
    if(fits || start>=N){ plan.push({from:start,to:N,last:true}); break; }

    sh=mountSheet(stage,pageHTML(P,opts(first,false,start,start)));
    var tb=sh.querySelector('.sh-items tbody');
    var ref=tb.querySelector('tr.carry-out');
    var holder=document.createElement('tbody');
    var i=start;
    while(i<N){
      holder.innerHTML=P.rows[i];
      var tr=holder.firstChild;
      tb.insertBefore(tr,ref);
      if(sheetOverflows(sh)){ tb.removeChild(tr); break; }
      i++;
    }
    stage.removeChild(sh);
    if(i===start) i=start+1;                  // แถวเดียวสูงเกินหนึ่งหน้า: ปล่อยตามจริง กันวนไม่รู้จบ
    else if(i>=N && N-1>start) i=N-1;         // แถวพอดีหน้าแต่ยอดรวมไม่พอ: ยกแถวสุดท้ายไปหน้าถัดไป
    plan.push({from:start,to:i,last:false});
    start=i;
  }
  return plan;
}

/* จัดเอกสารหนึ่งชุด (ต้นฉบับหรือสำเนา) ลงเวที แล้วคืนจำนวนหน้า
   ต้องเรียกขณะเวทีแสดงอยู่บนจอ (วัดความสูงจริงได้) */
function layoutDocInto(stage,d,copyLabel,lang){
  var P=sheetParts(d,copyLabel,lang), N=P.rows.length;
  var one=mountSheet(stage,pageHTML(P,{first:true,last:true,from:0,to:N,
    fill:Math.max(0,P.maxFill-N),page:1,pages:1}));
  if(fitSheet(one).fit) return {pages:1, overflow:false};
  stage.removeChild(one);

  var plan=planPages(stage,P), pages=plan.length, run=0, html='';
  plan.forEach(function(pg,i){
    var cin=(!P.noPrice && i>0) ? r2(run) : null;
    for(var k=pg.from;k<pg.to;k++) run=r2(run+num(P.amounts[k]));
    var cout=(!P.noPrice && !pg.last) ? r2(run) : null;
    html+=pageHTML(P,{first:i===0,last:pg.last,from:pg.from,to:pg.to,
      page:i+1,pages:pages,carryIn:cin,carryOut:cout});
  });
  var box=document.createElement('div');
  box.innerHTML=html;
  var made=[].slice.call(box.children), over=false;
  made.forEach(function(sh){ stage.appendChild(sh); });
  made.forEach(function(sh){
    if(sheetOverflows(sh)){ sh.classList.add('sheet-free'); over=true; }
  });
  return {pages:pages, overflow:over};
}

/* ย่อเวทีให้พอดีจอมือถือ หลังจัดหน้าเสร็จแล้วเท่านั้น (ตอนพิมพ์ CSS คืนค่า zoom เป็น 1) */
function fitStageToScreen(stage){
  stage.style.zoom='';
  var w=window.innerWidth||document.documentElement.clientWidth||0;
  if(!w || w>=860) return;
  var sh=stage.querySelector('.sheet'); if(!sh||!sh.offsetWidth) return;
  var z=Math.floor(Math.min(1,(w-24)/sh.offsetWidth)*100)/100;
  if(z>0 && z<1) stage.style.zoom=String(z);
}
/* ฟอนต์โหลดเสร็จหลังจัดหน้าไปแล้ว ความสูงตัวอักษรจะเปลี่ยน จึงต้องจัดหน้าใหม่อีกรอบ */
function afterFonts(fn){
  try{
    if(document.fonts && document.fonts.status!=='loaded' && document.fonts.ready)
      document.fonts.ready.then(function(){ fn(); });
  }catch(e){}
}
/* ตรวจทุกแผ่นก่อนสั่งพิมพ์ ถ้ามีแผ่นไหนล้น (เช่น ฟอนต์เพิ่งโหลด) ให้จัดหน้าใหม่ก่อน */
function stageHasOverflow(stage){
  var z=stage.style.zoom; stage.style.zoom='';
  var bad=[].some.call(stage.querySelectorAll('.sheet:not(.sheet-free)'),sheetOverflows);
  stage.style.zoom=z;
  return bad;
}

/* ชื่อหน้าต่างระหว่างพิมพ์ = ชื่อไฟล์ตั้งต้นตอน “บันทึกเป็น PDF” */
var _docTitle=null;
function beginPrintMode(name){
  document.body.classList.add('printing');
  if(_docTitle===null) _docTitle=document.title;
  if(name) document.title=String(name).replace(/[\\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim();
}
function endPrintMode(){
  if(document.querySelector('#modal-root .print-overlay')) return;
  document.body.classList.remove('printing');
  if(_docTitle!==null){ document.title=_docTitle; _docTitle=null; }
}

function openPrint(d,which,langView){
  var t=DOCTYPE[d.type];
  /* langView คือภาษาที่กำลังดูอยู่ ถ้าไม่ส่งมาให้ใช้ภาษาที่บันทึกไว้ในเอกสาร
     การสลับภาษาตรงนี้เป็นการดูตัวอย่างเท่านั้น ไม่เขียนทับข้อมูลที่บันทึกแล้ว */
  var lang=normLang(langView||d.lang);
  var other=(lang==='en'?'th':'en');
  var copies = which==='all' ? t.copies : [t.copies[0]];
  if(t.copies.length===1) copies=[null];
  var titleTxt=(lang==='en'?docTitleEn(d):docTitleTh(d));
  var unsaved=(lang!==normLang(d.lang));
  var body=''+
    '<div class="no-print" style="position:sticky;top:0;z-index:5;background:var(--rail);color:#fff;'+
      'padding:11px 16px;display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap">'+
      '<div style="font-size:13px">'+esc(titleTxt)+' '+esc(d.no)+
        ' <span style="opacity:.6">· <span data-pageinfo>กำลังจัดหน้า…</span> · ตรวจหน้ากระดาษก่อนสั่งพิมพ์'+
        (unsaved?' · กำลังดูตัวอย่างภาษา'+esc(TT(lang,'langName'))+' ยังไม่ได้บันทึกลงเอกสาร':'')+'</span></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="btn btn-sm" data-act="lang">'+
          (lang==='en'?'ดูเป็นภาษาไทย':'View in English')+'</button>'+
        (unsaved?'<button class="btn btn-sm" data-act="savelang">บันทึกภาษานี้ลงเอกสาร</button>':'')+
        (t.copies.length>1?'<button class="btn btn-sm" data-act="copies">'+
          (which==='all'?'พิมพ์เฉพาะต้นฉบับ':'พิมพ์พร้อมสำเนา')+'</button>':'')+
        '<button class="btn btn-sm" data-act="close">ปิด</button>'+
        '<button class="btn btn-sm btn-primary" data-act="print">พิมพ์ / บันทึกเป็น PDF</button>'+
      '</div></div>'+
    '<div class="sheet-stage"></div>';

  var ov=document.createElement('div');
  ov.className='overlay print-overlay'; ov.style.padding='0'; ov.style.background='#6f6d68';
  ov.innerHTML='<div style="width:100%;max-width:none;margin:0">'+body+'</div>';
  var stage=ov.querySelector('.sheet-stage'), info=ov.querySelector('[data-pageinfo]');
  function close(){ ov.remove(); endPrintMode(); }
  function reopen(w,lg){ close(); openPrint(d,w,lg); }
  function run(){
    if(!ov.isConnected) return {pages:0,perCopy:0,over:false};
    stage.style.zoom='';
    stage.innerHTML='';
    var pages=0, perCopy=0, over=false;
    copies.forEach(function(cp){
      var r=layoutDocInto(stage,d,cp,lang);
      pages+=r.pages; perCopy=Math.max(perCopy,r.pages); if(r.overflow) over=true;
    });
    info.textContent=(perCopy>1?'เอกสาร '+perCopy+' หน้าต่อชุด · ':'')+'รวม '+pages+' แผ่น';
    fitStageToScreen(stage);
    return {pages:pages, perCopy:perCopy, over:over};
  }
  ov.addEventListener('click',function(e){
    var a=e.target.closest('[data-act]'); if(!a) return;
    var act=a.getAttribute('data-act');
    if(act==='close') close();
    if(act==='print'){ if(stageHasOverflow(stage)) run(); window.print(); }
    if(act==='lang')  reopen(which, other);
    if(act==='copies') reopen(which==='all'?'one':'all', lang);
    if(act==='savelang'){
      var saved=doc(d.id);
      if(saved){
        saved.lang=lang;
        if(isDefaultTerms(saved.type,saved.note)) saved.note=defaultTerms(saved.type,lang);
        save(); toast('บันทึกภาษา'+TT(lang,'langName')+'ลงเอกสารแล้ว','good');
      }else{
        d.lang=lang;
        if(isDefaultTerms(d.type,d.note)) d.note=defaultTerms(d.type,lang);
        toast('ตั้งภาษาให้เอกสารแล้ว อย่าลืมกดบันทึกเอกสาร','good');
      }
      if(EDIT && EDIT.id===d.id){
        if(isDefaultTerms(EDIT.type,EDIT.note)) EDIT.note=defaultTerms(EDIT.type,lang);
        EDIT.lang=lang;
      }
      reopen(which, lang);
    }
  });
  document.getElementById('modal-root').appendChild(ov);
  var pb=partyBlock(d,lang);
  beginPrintMode(d.no+' '+titleTxt+(pb&&pb.name&&d.partyId?' '+pb.name:''));
  var res=run();
  if(res.perCopy>1)
    toast('เอกสารมีรายการมาก ระบบแบ่งเป็น '+res.perCopy+' หน้าต่อชุด พร้อมหัวเอกสาร เลขหน้า'+
      (DOCTYPE[d.type].noPrice?'':' และยอดยกไป')+'ทุกหน้า','',5200);
  if(res.over)
    toast('มีเนื้อหาบางส่วน (เช่น หมายเหตุ) ยาวเกินหนึ่งหน้า กรุณาตรวจตัวอย่างก่อนพิมพ์','bad',6500);
  afterFonts(run);
}

/* ---------------------------------------------------------------
   10b. ตัวสร้างกระดาษคู่มือการใช้งานผลิตภัณฑ์ (A4 หนึ่งแผ่นต่อหนึ่งผลิตภัณฑ์)
   ออกแบบให้ส่งลูกค้าได้ทีละใบ แยกตามผลิตภัณฑ์ที่ลูกค้าขอ
   ใช้กระดาษและระบบจัดหน้าชุดเดียวกับเอกสารธุรกิจ (fitSheet) จึงพิมพ์ได้พอดี A4
--------------------------------------------------------------- */
function guideSkus(code){
  return DB.products.filter(function(p){ return p.guideCode===code; })
    .map(function(p){ return p.sku; }).join('  ·  ');
}
function bullets(arr,cls){
  if(!arr||!arr.length) return '';
  return '<ul class="'+(cls||'gd-ul')+'">'+arr.map(function(x){
    return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>';
}

function guideHTML(g){
  var c=DB.company;

  var coMeta=[];
  coMeta.push(c.addr1||''); if(c.addr2) coMeta.push(c.addr2);
  var l3=[];
  if(c.phone) l3.push('โทร. '+c.phone);
  if(c.line)  l3.push('LINE '+c.line);
  if(c.email) l3.push(c.email);
  if(l3.length) coMeta.push(l3.join('  ·  '));

  var logoHTML = c.logo
    ? '<img src="'+esc(c.logo)+'" alt="" style="width:15mm;height:auto;flex:0 0 auto">'
    : '<span style="flex:0 0 auto;color:#000">'+LOGO_SVG+'</span>';

  /* ตารางอัตราส่วนผสม */
  var mixRows=(g.mix||[]).map(function(m){
    return '<tr><td class="m-r">'+esc(m.r)+'</td><td>'+esc(m.per10)+'</td>'+
      '<td>'+esc(m.y38)+'</td><td>'+esc(m.y20)+'</td></tr>';
  }).join('');
  var mixHTML = mixRows ?
    '<table class="gd-mix"><thead><tr><th>อัตราส่วน</th><th>'+
      (g.ready?'การใช้งาน':'น้ำยาต่อน้ำ 10 ลิตร')+'</th>'+
      '<th>'+(g.ready?'แกลลอน 3.8 ล. ใช้ได้':'ได้น้ำยาพร้อมใช้ (3.8 ล.)')+'</th>'+
      '<th>'+(g.ready?'ถัง 20 ล. ใช้ได้':'ได้น้ำยาพร้อมใช้ (20 ล.)')+'</th></tr></thead>'+
      '<tbody>'+mixRows+'</tbody></table>'+
    (g.mixNote?'<div class="gd-fine">'+esc(g.mixNote)+'</div>':'') : '';

  /* สารสำคัญตามฉลาก */
  var ingHTML;
  if((g.ingredients||[]).length){
    ingHTML='<table class="gd-ing"><tbody>'+g.ingredients.map(function(x){
      return '<tr><td><span class="i-th">'+esc(x.th)+'</span>'+
        (x.en?'<span class="i-en">'+esc(x.en)+'</span>':'')+'</td>'+
        '<td class="i-p">'+esc(x.pct||'')+'</td></tr>';
    }).join('')+'</tbody></table>';
  }else{
    ingHTML='<div class="gd-fine">'+esc(g.ingredientNote||'ดูรายละเอียดบนฉลากผลิตภัณฑ์')+'</div>';
  }

  var skus=guideSkus(g.code);

  return ''+
  '<div class="sheet gd" data-guide="'+esc(g.code)+'">'+
    '<div class="sh-top">'+
      '<div class="sh-co">'+logoHTML+
        '<div><div class="sh-co-name">'+esc(c.nameTh)+'</div>'+
          '<div class="sh-co-en">'+esc(c.nameEn)+'</div>'+
          '<div class="sh-co-meta">'+coMeta.map(esc).join('<br>')+'</div></div></div>'+
      '<div class="sh-title"><h2>คู่มือการใช้งานผลิตภัณฑ์</h2>'+
        '<div class="en">PRODUCT USER GUIDE</div></div>'+
    '</div>'+
    '<hr class="sh-rule">'+

    '<div class="gd-hero">'+
      '<div class="gd-brand">'+esc(g.brand)+'</div>'+
      '<div class="gd-name">'+esc(g.name)+'</div>'+
      '<div class="gd-en">'+esc(g.en)+'</div>'+
      '<div class="gd-tag">'+esc(g.tagline||'')+'</div>'+
      '<div class="gd-packs">'+esc(g.packs||'')+(skus?'  ·  '+esc(skus):'')+'</div>'+
    '</div>'+

    '<div class="gd-rate">'+
      '<div class="gd-rate-l">อัตราการเจือจาง</div>'+
      '<div class="gd-rate-v">'+esc(g.dilution||'')+'</div>'+
      (g.dilutionNote?'<div class="gd-rate-n">'+esc(g.dilutionNote)+'</div>':'')+

        '<div class="gd-sec gd-warn"><div class="gd-h">ข้อควรระวังในการใช้งาน</div>'+bullets(g.cautions)+'</div>'+

/* พิมพ์คู่มือ รับได้ทั้งฉบับเดียวและหลายฉบับพร้อมกัน (เช่น แนบไปกับใบส่งตัวอย่าง) */
function openGuidePrint(codes){
  var list=(Array.isArray(codes)?codes:[codes])
    .map(function(x){ return typeof x==='string'?guide(x):x; })
    .filter(function(g){ return !!g; });
  if(!list.length){ toast('ไม่พบคู่มือของผลิตภัณฑ์นี้','bad'); return; }

  var sheets=list.map(guideHTML).join('');
  var head = list.length===1 ? 'คู่มือการใช้งาน '+list[0].name
                             : 'คู่มือการใช้งาน '+list.length+' ผลิตภัณฑ์';
  var body=''+
    '<div class="no-print" style="position:sticky;top:0;z-index:5;background:var(--rail);color:#fff;'+
      'padding:11px 16px;display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap">'+
      '<div style="font-size:13px">'+esc(head)+
        ' <span style="opacity:.6">· หนึ่งผลิตภัณฑ์ต่อหนึ่งแผ่น A4 ส่งลูกค้าแยกใบได้</span></div>'+
      '<div style="display:flex;gap:8px">'+
        '<button class="btn btn-sm" data-act="close">ปิด</button>'+
        '<button class="btn btn-sm btn-primary" data-act="print">พิมพ์ / บันทึกเป็น PDF</button>'+
      '</div></div>'+
    '<div class="sheet-stage">'+sheets+'</div>';

  var ov=document.createElement('div');
  ov.className='overlay print-overlay'; ov.style.padding='0'; ov.style.background='#6f6d68';
  ov.innerHTML='<div style="width:100%;max-width:none;margin:0">'+body+'</div>';
  var stage=ov.querySelector('.sheet-stage');
  /* คู่มือหนึ่งฉบับออกแบบให้จบในหนึ่งแผ่น ถ้ายาวเกินจริงจึงปล่อยให้ไหลต่อหน้าถัดไป */
  function run(){
    if(!ov.isConnected) return 0;
    stage.style.zoom='';
    var over=0;
    [].forEach.call(stage.querySelectorAll('.sheet'),function(sh){
      if(!fitSheet(sh).fit){ sh.classList.add('sheet-free'); over++; }
    });
    fitStageToScreen(stage);
    return over;
  }
  ov.addEventListener('click',function(e){
    var a=e.target.closest('[data-act]'); if(!a) return;
    var act=a.getAttribute('data-act');
    if(act==='close'){ ov.remove(); endPrintMode(); }
    if(act==='print'){ if(stageHasOverflow(stage)) run(); window.print(); }
  });
  document.getElementById('modal-root').appendChild(ov);
  beginPrintMode(head);
  var over=run();
  if(over) toast('มีคู่มือ '+over+' ฉบับที่เนื้อหายาวเกินหนึ่งหน้า จะพิมพ์ต่อหน้าถัดไป','',4200);
  afterFonts(run);
}

      '<td class="num mono">'+(isSample&&m.payable<=0?'—':money(m.payable))+'</td>'+
      '<td>'+tag(statusOf(type,d.status))+
        (overdue?' <span class="tag tag-stop">เกิน '+daysBetween(d.dueDate,today())+' วัน</span>':'')+

/* แจ้งเตือนล่วงหน้าว่าอะไรจะถอยไปพิมพ์เป็นภาษาไทยบ้าง
   ดีกว่าปล่อยให้รู้ตอนเอกสารถึงมือลูกค้าต่างชาติแล้ว */
function langGaps(d){
  var gaps=[];
  if(normLang(d.lang)!=='en') return gaps;
  var c=DB.company;
  if(!String(c.nameEn||'').trim()) gaps.push('ชื่อกิจการภาษาอังกฤษ');
  if(!String(c.addrEn1||'').trim() && !String(c.addrEn2||'').trim()) gaps.push('ที่อยู่กิจการภาษาอังกฤษ');
  var p=d.partySnapshot||(d.partyKind==='supplier'?supplier(d.partyId):customer(d.partyId));
  if(p){
    if(!String(p.nameEn||'').trim()) gaps.push('ชื่อคู่ค้าภาษาอังกฤษ');
    if((p.addr1||p.addr2) && !String(p.addrEn1||'').trim() && !String(p.addrEn2||'').trim())
      gaps.push('ที่อยู่คู่ค้าภาษาอังกฤษ');
  }
  /* เตือนเฉพาะเอกสารที่พิมพ์บล็อกชำระเงิน ใบส่งของกับใบเสร็จไม่ต้องใช้ */
  if((d.type==='QT'||d.type==='IV'||d.type==='BN') && c.bankAcctNo){
    if(!String(c.bankAcctNameEn||'').trim()) gaps.push('ชื่อบัญชีธนาคารภาษาอังกฤษ');
    if(!String(c.bankNameEn||'').trim()) gaps.push('ชื่อธนาคารภาษาอังกฤษ');
  }
  var noName=0;
  (d.items||[]).forEach(function(it){
    var pr=it.productId?product(it.productId):null;
    var v=it.nameEn||(pr?pr.nameEn:'');
    if(!String(v||'').trim()) noName++;
  });
  if(noName) gaps.push('ชื่อสินค้าภาษาอังกฤษ '+noName+' รายการ');
  return gaps;
}
function langReadyHTML(d){
  if(normLang(d.lang)!=='en')

  return '<div class="notice notice-warn" style="margin:0"><div>'+

/* ผูกคู่ค้าเข้ากับเอกสาร พร้อมดึงค่าที่ตั้งไว้ในทะเบียน (เครดิต ผู้ติดต่อ ภาษาเอกสาร)
   ใช้ร่วมกันทุกทางที่เลือกคู่ค้า: เลือกจากรายการ เพิ่มคู่ค้าใหม่ และปุ่มจากหน้าทะเบียนลูกค้า
   เดิมปุ่ม “เสนอราคา/ส่งตัวอย่าง” จากหน้าทะเบียนไม่ได้ตั้งภาษาเอกสารตามลูกค้า */
function applyParty(d,quiet){
  var p = d.partyKind==='supplier'?supplier(d.partyId):customer(d.partyId);
  // ภาพข้อมูลคู่ค้าเดิมต้องล้าง ไม่เช่นนั้นการพิมพ์ก่อนบันทึกจะยังขึ้นชื่อคู่ค้าเก่า
  d.partySnapshot=p?JSON.parse(JSON.stringify(p)):null;
  if(!p) return d;
  if((d.type==='IV'||d.type==='BN') && num(p.creditDays)>0 && validIso(d.date))
    d.dueDate=addDays(d.date,p.creditDays);
  if(p.contact && !d.contactRef) d.contactRef=p.contact;
  /* ทะเบียนลูกค้าตั้งภาษาไว้ ให้เอกสารตามนั้นทันที จะได้ไม่ลืมสลับเอง */
  if(p.docLang && normLang(p.docLang)!==normLang(d.lang)){
    setDocLang(d, p.docLang);
    if(!quiet) toast('ตั้งภาษาเอกสารเป็น'+TT(d.lang,'langName')+'ตามทะเบียนลูกค้าแล้ว');
  }
  return d;
}
/* เปลี่ยนวันที่เอกสาร: เลื่อนวันครบกำหนดตามระยะเดิม และเลขที่เอกสารใหม่ที่ยังไม่บันทึก
   ต้องย้ายไปชุดเลขของเดือนใหม่ (เลขที่เอกสารผูกกับปีและเดือนของวันที่) */
function changeDocDate(d,newDate,oldDate){
  if(!validIso(newDate)) return;
  if(d.dueDate && validIso(oldDate) && validIso(d.dueDate)){
    var gap=daysBetween(oldDate,d.dueDate);
    if(isFinite(gap)) d.dueDate=addDays(newDate,gap);
  }else if(!d.dueDate && defaultDueDays(d.type)){
    d.dueDate=addDays(newDate,defaultDueDays(d.type));
  }
  if(!doc(d.id) && d._bucket && d.no===d._bucket+String(d._seq).padStart(3,'0')){
    var pk=peekDocNo(d.type,newDate);
    if(pk.bucket!==d._bucket){ d.no=pk.no; d._bucket=pk.bucket; d._seq=pk.n; }
  }
}

/* สลับภาษาเอกสาร พร้อมสลับข้อความมาตรฐานให้ตรงภาษา
   สลับเฉพาะกรณีข้อความยังเป็นค่ามาตรฐานอยู่ ถ้าผู้ใช้พิมพ์เองไว้จะไม่แตะต้อง */
function setDocLang(d,lang){
  var was=normLang(d.lang);
  d.lang=normLang(lang);
  if(was!==d.lang && isDefaultTerms(d.type,d.note)) d.note=defaultTerms(d.type,d.lang);
  EDIT_DIRTY=true;
  return d.lang;
}

/* --- การผูกเหตุการณ์ในตัวแก้ไข --- */
function bindEditor(){
  // ต้องผูกที่ .main ไม่ใช่ .view เพราะปุ่มบันทึก/พิมพ์/แปลงเอกสาร อยู่บนแถบหัวเรื่อง
  var root=document.querySelector('.main'); if(!root) return;

  root.addEventListener('input',function(e){
    var el=e.target, i;
    if(el.hasAttribute('data-l')){
      i=+el.getAttribute('data-i');
      var k=el.getAttribute('data-l');
      if(!EDIT.items[i]) return;
      EDIT.items[i][k]=(k==='qty'||k==='price'||k==='disc')?num(el.value):el.value;
      EDIT_DIRTY=true;
      if(k==='name') showPicker(el,i);
      else refreshTotalsOnly();
    }else if(el.hasAttribute('data-d')){
      var key=el.getAttribute('data-d');
      var v = el.type==='checkbox' ? el.checked
            : (['disc','whtRate','vatRate'].indexOf(key)>=0 ? num(el.value) : el.value);
      var before=EDIT[key];
      EDIT[key]=v; EDIT_DIRTY=true;
      if(key==='partyId'||key==='status'||key==='lang'||key==='returnStock') return;   // จะ re-render ตอน change
      /* วันที่: อัปเดตเฉพาะจุดที่เกี่ยวข้อง ไม่วาดทั้งหน้าใหม่
         เดิมวาดใหม่ทุกครั้งที่พิมพ์ ทำให้พิมพ์วันที่ด้วยแป้นพิมพ์ได้ทีละหนึ่งตัวแล้วเคอร์เซอร์หลุด */
      if(key==='date'){ changeDocDate(EDIT,v,before); refreshEditorDates(); return; }
      if(key==='dueDate'){ refreshEditorDates(); return; }
      refreshTotalsOnly();
    }
  });

  root.addEventListener('change',function(e){
    var el=e.target;
    if(el.hasAttribute('data-d')){
      var key=el.getAttribute('data-d');
      if(key==='partyId'){ applyParty(EDIT); render(); }
      else if(key==='lang'){ setDocLang(EDIT, el.value); render(); }
      else if(key==='status'||key==='returnStock'){ render(); }
      else if(key==='vat'||key==='wht'||key==='discType'||key==='payMethod') render();
    }
    if(el.hasAttribute('data-l') && el.getAttribute('data-l')==='discType') render();
  });

  root.addEventListener('click',function(e){
    var el;
    if((el=e.target.closest('[data-add-line]'))){ EDIT.items.push(blankItem()); EDIT_DIRTY=true; render();
      setTimeout(function(){ var ins=document.querySelectorAll('[data-l="name"]');
        if(ins.length) ins[ins.length-1].focus(); },30); return; }
    if((el=e.target.closest('[data-add-all]'))){ addAllProducts(); return; }
    if((el=e.target.closest('[data-del-line]'))){
      EDIT.items.splice(+el.getAttribute('data-del-line'),1); EDIT_DIRTY=true; render(); return; }
    if((el=e.target.closest('[data-save]'))){ doSaveDoc(); return; }
    if((el=e.target.closest('[data-cancel]'))){ closeEditor(); return; }
    if((el=e.target.closest('[data-delete]'))){ confirmDeleteDoc(); return; }
    if((el=e.target.closest('[data-print-cur]'))){
      /* พิมพ์ฉบับที่ยังไม่บันทึกทำให้กระดาษที่ส่งลูกค้าไม่ตรงกับข้อมูลในระบบ จึงให้บันทึกก่อน */
      if(EDIT_DIRTY||!doc(EDIT.id)){
        confirmBox('บันทึกก่อนพิมพ์','เอกสารนี้มีการแก้ไขที่ยังไม่ได้บันทึก<br>'+
          'ระบบจะบันทึกก่อน แล้วเปิดหน้าตัวอย่างก่อนพิมพ์ให้ทันที เพื่อให้เอกสารที่พิมพ์ตรงกับข้อมูลในระบบ',
          'บันทึกแล้วพิมพ์',function(){ doSaveDoc(function(){ openPrint(EDIT,'one'); }); });
      }else openPrint(EDIT,'one');
      return; }
    if((el=e.target.closest('[data-guide-edit]'))){ printGuidesForDoc(EDIT); return; }
    if((el=e.target.closest('[data-convert]'))){ openConvert(); return; }
    if((el=e.target.closest('[data-new-party]'))){ openPartyForm(el.getAttribute('data-new-party'),null,function(p){
      EDIT.partyId=p.id; applyParty(EDIT); EDIT_DIRTY=true; render(); }); return; }
  });

  root.addEventListener('keydown',function(e){
    var el=e.target;
    if(el.hasAttribute('data-l') && el.getAttribute('data-l')==='name'){
      var list=document.querySelector('.pick-list');
      if(!list) return;
      var items=[].slice.call(list.querySelectorAll('.pick-item'));
      var cur=list.querySelector('.pick-item.on');
      var idx=items.indexOf(cur);
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){
        e.preventDefault();
        var next=e.key==='ArrowDown'?Math.min(idx+1,items.length-1):Math.max(idx-1,0);
        items.forEach(function(x){x.classList.remove('on');});
        if(items[next]){ items[next].classList.add('on'); items[next].scrollIntoView({block:'nearest'}); }
      }else if(e.key==='Enter'){
        /* ตัวเลือกฟังเหตุการณ์ mousedown เดิมสั่ง .click() จึงไม่มีอะไรเกิดขึ้นเมื่อกด Enter */
        e.preventDefault();
        var pick=cur||items[0];
        if(pick) applyProduct(+el.getAttribute('data-i'), pick.getAttribute('data-pick'));
      }else if(e.key==='Escape'){ list.remove(); }
    }
  });
}

/* รวบรวมคู่มือของสินค้าที่อยู่ในเอกสาร แล้วสั่งพิมพ์เป็นชุดเดียว
   ผลิตภัณฑ์เดียวกันคนละขนาดบรรจุใช้คู่มือฉบับเดียวกัน จึงตัดรายการซ้ำออก */
function guideCodesOfDoc(d){
  var seen={}, out=[];
  (d.items||[]).forEach(function(it){
    var p=it.productId?product(it.productId):null;
    var code=p&&p.guideCode;
    if(code && !seen[code] && guide(code)){ seen[code]=1; out.push(code); }
  });
  return out;
}
function printGuidesForDoc(d){
  var codes=guideCodesOfDoc(d);
  if(!codes.length){
    toast('รายการในเอกสารนี้ยังไม่ได้เลือกจากทะเบียนสินค้า จึงยังไม่มีคู่มือให้พิมพ์','bad',5000); return;
  }
  openGuidePrint(codes);
}

function refreshTotalsOnly(){
  // อัปเดตเฉพาะตัวเลข ไม่ re-render ทั้งหน้า เพื่อไม่ให้เคอร์เซอร์กระโดดขณะพิมพ์
  var m=calcDoc(EDIT);
  document.querySelectorAll('.line-table tbody tr[data-line]').forEach(function(tr){
    var i=+tr.getAttribute('data-line');
    var cell=tr.querySelector('td.num.mono');
    if(cell && EDIT.items[i]) cell.textContent=money(lineAmount(EDIT.items[i]));
  });
  var sub=document.querySelector('[data-tot="sub"]');   if(sub) sub.textContent=money(m.sub);
  var base=document.querySelector('[data-tot="base"]'); if(base) base.textContent=money(m.taxBase);
  var vat=document.querySelector('[data-tot="vat"]');   if(vat) vat.textContent=money(m.vat);
  var gr=document.querySelector('[data-tot="grand"]');  if(gr) gr.textContent=money(m.grand);
  var pay=document.querySelector('[data-tot="pay"]');   if(pay) pay.textContent=money(m.payable);
  var w=document.querySelector('[data-tot="words"]');
  if(w) w.textContent='('+bahtText(m.wht>0?m.payable:m.grand)+')';
}

function refreshEditorDates(){
  var d=EDIT; if(!d) return;
  var no=document.querySelector('[data-d="no"]');
  if(no && no!==document.activeElement && no.value!==d.no) no.value=d.no;
  var due=document.querySelector('[data-d="dueDate"]');

/* ตัวเลือกสินค้าแบบพิมพ์ค้นหา */
function showPicker(input,i){
  var old=document.querySelector('.pick-list'); if(old) old.remove();
  var q=input.value.trim().toLowerCase();
  if(!q){ return; }
  var hits=DB.products.filter(function(p){
    if(!p.active) return false;
    return (p.name+' '+p.sku+' '+p.brand+' '+p.pack).toLowerCase().indexOf(q)>=0;
  }).slice(0,8);
  if(!hits.length) return;
  var box=document.createElement('div');
  box.className='pick-list';
  box.innerHTML=hits.map(function(p,k){
    var priceTxt = num(p.price)>0 ? money(p.price)+' บาท' : '<span style="color:#9d3232">ยังไม่ตั้งราคา</span>';
    return '<div class="pick-item'+(k===0?' on':'')+'" data-pick="'+p.id+'">'+
      '<div class="pi-1"><span>'+esc(p.name)+'</span><span class="mono">'+priceTxt+'</span></div>'+
      '<div class="pi-2"><span>'+esc(p.pack)+' · '+esc(p.sku)+'</span>'+
        '<span>คงเหลือ '+qtyFmt(p.stock)+' '+esc(p.unit)+'</span></div></div>';
  }).join('');
  input.parentNode.appendChild(box);
  box.addEventListener('mousedown',function(e){
    var it=e.target.closest('[data-pick]'); if(!it) return;
    e.preventDefault();
    applyProduct(i, it.getAttribute('data-pick'));
  });
  setTimeout(function(){
    document.addEventListener('mousedown',function h(ev){
      if(!box.contains(ev.target)&&ev.target!==input){ box.remove(); document.removeEventListener('mousedown',h); }
    });
  },0);
}
function applyProduct(i,pid){
  var p=product(pid); if(!p||!EDIT.items[i]) return;
  var it=EDIT.items[i];
  fillItemFromProduct(it,p,EDIT.type);
  if(!num(it.qty)) it.qty=1;
  EDIT_DIRTY=true; render();
}
/* ใบสั่งซื้อและใบส่งตัวอย่างใช้ "ราคาทุน" — เอกสารขายใช้ "ราคาขาย"
   รวมไว้ที่เดียวเพื่อไม่ให้ราคาทุนหลุดไปอยู่ในเอกสารที่ส่งให้ลูกค้า */
function priceForDoc(type,p){
  var t=DOCTYPE[type];
  return (t.dir==='in'||t.noPrice) ? num(p.cost) : num(p.price);

function addAllProducts(){
  var act=DB.products.filter(function(p){return p.active;});
  var have={}; EDIT.items.forEach(function(it){ if(it.productId) have[it.productId]=1; });
  var added=0;
  act.forEach(function(p){
    if(have[p.id]) return;
    var it=fillItemFromProduct(blankItem(),p,EDIT.type);
    it.qty=1; EDIT.items.push(it); added++;
  });
  EDIT_DIRTY=true; render();
  toast(added?'เพิ่ม '+added+' รายการแล้ว ปรับจำนวนและลบรายการที่ไม่ต้องการได้':'สินค้าทุกรายการอยู่ในเอกสารแล้ว');
}

/* --- บันทึก / ปิด / ลบ --- */
/* after: งานที่ทำต่อหลังบันทึกสำเร็จ (เช่น เปิดหน้าพิมพ์) */
function doSaveDoc(after){
  var d=EDIT;
  if(!d.partyId){ toast('กรุณาเลือก'+(d.partyKind==='supplier'?'ผู้ขาย':'ลูกค้า')+'ก่อนบันทึก','bad'); return; }
  if(!(d.items||[]).length){ toast('กรุณาเพิ่มรายการสินค้าอย่างน้อย 1 รายการ','bad'); return; }
  var noName=d.items.some(function(it){ return !String(it.name||'').trim(); });
  if(noName){ toast('มีรายการที่ยังไม่ได้ระบุชื่อสินค้า','bad'); return; }
  /* ช่องตัวเลขรับค่าติดลบได้ถ้าพิมพ์เอง จำนวนติดลบในใบส่งของจะกลายเป็นรับของเข้าสต็อก */
  var neg=d.items.some(function(it){ return num(it.qty)<0 || num(it.price)<0 || num(it.disc)<0; });
  if(neg){ toast('จำนวน ราคา และส่วนลด ต้องไม่ติดลบ หากต้องการลดหนี้ให้ใช้ใบลดหนี้','bad',5000); return; }
  if(num(d.disc)<0 || num(d.whtRate)<0){ toast('ส่วนลดท้ายบิลและอัตราหัก ณ ที่จ่าย ต้องไม่ติดลบ','bad',5000); return; }
  if(!validIso(d.date)){ toast('กรุณาระบุวันที่เอกสารให้ถูกต้อง','bad'); return; }
  if(d.dueDate && !validIso(d.dueDate)){ toast('วันครบกำหนดไม่ถูกต้อง กรุณาเลือกใหม่หรือเว้นว่าง','bad'); return; }
  d.no=String(d.no||'').trim();
  if(!d.no){ toast('กรุณาระบุเลขที่เอกสาร','bad'); return; }
  var dup=DB.docs.some(function(x){ return x.no===d.no && x.id!==d.id; });
  if(dup){ toast('เลขที่เอกสาร '+d.no+' ถูกใช้ไปแล้ว กรุณาเปลี่ยนเลขที่','bad',5000); return; }

  /* ตรวจสต็อกทุกสถานะที่ทำให้ของออกจากคลัง (รวม “ติดตามผลแล้ว/ปิดการขาย” ของใบส่งตัวอย่าง) */
  if(isPosted(d) && movesStock(d) && DOCTYPE[d.type].stock==='out'){
    var sh=stockShortage(d);
    if(sh.length){
      confirmBox('สต็อกไม่พอ','ยืนยันบันทึกเป็น “'+statusOf(d.type,d.status).th+'” หรือไม่<br><br>'+
        sh.map(function(s){ return '· '+esc(s.product.name)+' '+esc(s.product.pack)+
          ' ขาด '+qtyFmt(s.short)+' '+esc(s.product.unit); }).join('<br>')+
        '<br><br>หากยืนยัน สต็อกของสินค้าเหล่านี้จะติดลบ ซึ่งใช้เป็นสัญญาณว่าต้องเร่งรับของเข้า',
        'ยืนยันบันทึก', function(){ finishSave(d,after); });
      return;
    }
  }
  finishSave(d,after);
}
function finishSave(d,after){
  saveDoc(d);
  EDIT=JSON.parse(JSON.stringify(doc(d.id))); EDIT_DIRTY=false;
  toast(DOCTYPE[d.type].th+' '+d.no+' บันทึกแล้ว'+(Store.persistent()?'':' (ชั่วคราว — กรุณาสำรองข้อมูล)'),
    Store.persistent()?'good':'bad');
  (LAST_LINKED||[]).forEach(function(x){
    toast(DOCTYPE[x.type].th+' '+x.no+' ปรับสถานะเป็น “'+statusOf(x.type,x.status).th+'” ให้อัตโนมัติ','',5200);
  });
  LAST_LINKED=[];
  render();
  if(typeof after==='function') after();
}

        if(diff===0){ toast('ยอดเท่าเดิม ไม่มีการเปลี่ยนแปลง'); ov.remove(); return; }

function poFromLowStock(){
  var low=lowStock(); if(!low.length){ toast('ไม่มีสินค้าที่ต่ำกว่าจุดสั่งซื้อ'); return; }
  var d=newDoc('PO');
  low.forEach(function(p){
    var it=fillItemFromProduct(blankItem(),p,'PO');   // ใบสั่งซื้อใช้ราคาทุน
    it.qty=Math.max(r2(num(p.minStock)*2-num(p.stock)),1);
    d.items.push(it);
  });
  if(DB.suppliers.length===1){ d.partyId=DB.suppliers[0].id; applyParty(d,true); }
  EDIT=d; EDIT_DIRTY=true; go('editor');
  toast('ตั้งจำนวนสั่งซื้อเป็น 2 เท่าของจุดสั่งซื้อให้แล้ว ปรับได้ตามต้องการ');
}

      var list=kind==='supplier'?DB.suppliers:DB.customers;   // อ่านใหม่ เผื่อข้อมูลถูกโหลดใหม่ระหว่างเปิดฟอร์ม
      var cur=(c.id&&byId(list,c.id))||c;
      var obj=Object.assign({}, cur, { id:c.id||uid(kind==='supplier'?'sp':'cu'), name:name,
        branch:ov.querySelector('#pf-branch').value.trim(), taxId:tax,
        addr1:ov.querySelector('#pf-a1').value.trim(), addr2:ov.querySelector('#pf-a2').value.trim(),
        contact:ov.querySelector('#pf-contact').value.trim(),
        phone:ov.querySelector('#pf-phone').value.trim(),
        email:ov.querySelector('#pf-email').value.trim(),
        creditDays:num(ov.querySelector('#pf-credit').value),
        nameEn:ov.querySelector('#pf-nameen').value.trim(),
        branchEn:ov.querySelector('#pf-branchen').value.trim(),
        addrEn1:ov.querySelector('#pf-aen1').value.trim(),
        addrEn2:ov.querySelector('#pf-aen2').value.trim(),
        docLang:ov.querySelector('#pf-lang').value,
        note:ov.querySelector('#pf-note').value.trim() });
      var i=list.findIndex(function(x){return x.id===obj.id;});
      if(i<0) list.push(obj); else list[i]=obj;
      save(); ov.remove();
      toast('บันทึก'+label+' '+obj.name+' แล้ว','good');
      if(cb) cb(obj); else render();
    });
    var rm=ov.querySelector('[data-rm]');
    if(rm) rm.addEventListener('click',function(){
      var used=DB.docs.some(function(d){return d.partyId===c.id;});
      if(used){ toast('ลบไม่ได้ เพราะมีเอกสารอ้างอิงอยู่ — แนะนำให้แก้ไขข้อมูลแทน','bad',5000); return; }
      var list=kind==='supplier'?DB.suppliers:DB.customers;
      var i=list.findIndex(function(x){return x.id===c.id;});
      if(i>=0) list.splice(i,1);
      save(); ov.remove(); render(); toast('ลบแล้ว');
    });
  });
}

/* ---------------------------------------------------------------
   20. ชุดตรวจสอบระบบ (Self-test)
   ทดสอบสูตรคำนวณ ตรรกะสต็อก และกฎหมายภาษีที่ระบบบังคับ
   ทำงานบนสำเนาข้อมูล ไม่แตะข้อมูลจริงของผู้ใช้
--------------------------------------------------------------- */
function runSelfTest(){
  var results=[], snapshot=JSON.stringify(DB);
  /* ระหว่างทดสอบ ทุกการบันทึกไปลงหน่วยความจำแยก ไม่แตะข้อมูลจริงในเครื่องเลย
     เดิมเขียนลงที่เก็บจริงระหว่างทดสอบ ถ้าปิดหน้าต่างกลางคันจะเหลือเอกสารทดสอบค้างในระบบ */
  Store.sandbox(true);
  function t(name,fn){
    try{ var r=fn(); results.push({name:name, pass:r===true, detail:(r===true?'':String(r))}); }
    catch(e){ results.push({name:name, pass:false, detail:'ข้อผิดพลาด: '+e.message}); }
  }
  function eq(a,b,label){ return a===b?true:(label||'')+' คาดหวัง '+b+' แต่ได้ '+a; }

  t('คำนวณมูลค่ารายการ: 3 × 450 = 1,350', function(){
    return eq(lineAmount({qty:3,price:450,disc:0,discType:'thb'}),1350); });
  t('ส่วนลดรายการเป็นบาท: 3 × 450 − 50 = 1,300', function(){
    return eq(lineAmount({qty:3,price:450,disc:50,discType:'thb'}),1300); });
  t('ส่วนลดรายการเป็น %: 3 × 450 − 10% = 1,215', function(){
    return eq(lineAmount({qty:3,price:450,disc:10,discType:'pct'}),1215); });
  t('ส่วนลดมากกว่ามูลค่าไม่ทำให้ติดลบ', function(){
    return eq(lineAmount({qty:1,price:100,disc:500,discType:'thb'}),0); });

  t('VAT 7% จากฐาน 1,000 = 70 และรวม 1,070', function(){
    var d={items:[{qty:10,price:100,disc:0,discType:'thb'}],disc:0,discType:'thb',vat:true,vatRate:7};
    var m=calcDoc(d);
    return m.vat===70 ? eq(m.grand,1070,'ยอดรวม') : eq(m.vat,70,'VAT'); });
  t('ส่วนลดท้ายบิลคำนวณก่อน VAT', function(){
    var d={items:[{qty:10,price:100,disc:0,discType:'thb'}],disc:100,discType:'thb',vat:true,vatRate:7};
    var m=calcDoc(d);
    return m.taxBase===900 ? eq(m.grand,963,'ยอดรวม') : eq(m.taxBase,900,'ฐานภาษี'); });
  t('หัก ณ ที่จ่าย 3% หักจากฐานก่อน VAT', function(){
    var d={items:[{qty:1,price:1000,disc:0,discType:'thb'}],disc:0,discType:'thb',
           vat:true,vatRate:7,wht:true,whtRate:3};
    var m=calcDoc(d);
    return m.wht===30 ? eq(m.payable,1040,'ยอดชำระสุทธิ') : eq(m.wht,30,'ภาษีหัก ณ ที่จ่าย'); });
  t('ปิด VAT แล้วยอดรวมเท่ากับฐาน', function(){
    var d={items:[{qty:2,price:333.33,disc:0,discType:'thb'}],disc:0,discType:'thb',vat:false,vatRate:7};
    var m=calcDoc(d); return m.vat===0 ? eq(m.grand,666.66) : 'VAT ไม่เป็นศูนย์'; });
  t('ปัดเศษสตางค์ถูกต้อง: 3 × 33.335 = 100.01', function(){
    return eq(lineAmount({qty:3,price:33.335,disc:0,discType:'thb'}),100.01); });

  t('แปลงเงินเป็นตัวอักษร: 1,070 บาทถ้วน', function(){
    return eq(bahtText(1070),'หนึ่งพันเจ็ดสิบบาทถ้วน'); });
  t('แปลงเงินเป็นตัวอักษร: 21 → ยี่สิบเอ็ด', function(){
    return eq(bahtText(21),'ยี่สิบเอ็ดบาทถ้วน'); });
  t('แปลงเงินเป็นตัวอักษร: มีสตางค์ 1,234.50', function(){
    return eq(bahtText(1234.5),'หนึ่งพันสองร้อยสามสิบสี่บาทห้าสิบสตางค์'); });
  t('แปลงเงินเป็นตัวอักษร: หลักล้าน 2,000,000', function(){
    return eq(bahtText(2000000),'สองล้านบาทถ้วน'); });
  t('แปลงเงินเป็นตัวอักษร: ศูนย์บาทถ้วน', function(){
    return eq(bahtText(0),'ศูนย์บาทถ้วน'); });

  t('วันที่ไทยแปลงเป็น พ.ศ. ถูกต้อง', function(){
    return eq(thDate('2026-09-05','long'),'5 กันยายน พ.ศ. 2569'); });
  t('บวกวันครบกำหนดถูกต้อง (30 วัน)', function(){
    return eq(addDays('2026-09-05',30),'2026-10-05'); });

  /* --- ทดสอบวงจรจริง: ซื้อเข้า → ขายออก → ลบเอกสาร --- */
  t('วงจรสต็อกครบวงจร: รับเข้า 20 → ขายออก 5 → คงเหลือ 15', function(){
    var p=DB.products[0];
    var before=num(p.stock);
    var po=newDoc('PO'); po.partyId='__test__'; po.status='received';
    po.items=[{id:'t1',productId:p.id,name:p.name,qty:20,unit:p.unit,price:100,disc:0,discType:'thb'}];
    saveDoc(po);
    var afterIn=num(product(p.id).stock);
    var dn=newDoc('DN'); dn.partyId='__test__'; dn.status='delivered';
    dn.items=[{id:'t2',productId:p.id,name:p.name,qty:5,unit:p.unit,price:200,disc:0,discType:'thb'}];
    saveDoc(dn);
    var afterOut=num(product(p.id).stock);
    deleteDoc(po.id); deleteDoc(dn.id);
    var restored=num(product(p.id).stock);
    if(afterIn!==before+20) return 'รับเข้าผิด ได้ '+afterIn;
    if(afterOut!==before+15) return 'ขายออกผิด ได้ '+afterOut;
    return eq(restored,before,'ยอดหลังลบเอกสาร'); });

  t('เปลี่ยนสถานะกลับเป็นร่างแล้วสต็อกย้อนคืน', function(){
    var p=DB.products[0], before=num(p.stock);
    var dn=newDoc('DN'); dn.partyId='__test__'; dn.status='delivered';
    dn.items=[{id:'t3',productId:p.id,name:p.name,qty:7,unit:p.unit,price:100,disc:0,discType:'thb'}];
    saveDoc(dn);
    var out=num(product(p.id).stock);
    dn.status='draft'; saveDoc(dn);
    var back=num(product(p.id).stock);
    deleteDoc(dn.id);
    if(out!==before-7) return 'ตัดสต็อกผิด';
    return eq(back,before,'ยอดหลังย้อนเป็นร่าง'); });

  t('บันทึกซ้ำหลายครั้งไม่ตัดสต็อกซ้ำซ้อน', function(){
    var p=DB.products[0], before=num(p.stock);
    var dn=newDoc('DN'); dn.partyId='__test__'; dn.status='delivered';
    dn.items=[{id:'t4',productId:p.id,name:p.name,qty:4,unit:p.unit,price:100,disc:0,discType:'thb'}];
    saveDoc(dn); saveDoc(dn); saveDoc(dn);
    var after=num(product(p.id).stock);
    deleteDoc(dn.id);
    return eq(after,before-4,'ยอดหลังบันทึก 3 ครั้ง'); });

  t('ตรวจจับสต็อกไม่พอได้ถูกต้อง', function(){

      for(var j=0;j<70;j++) if(nos[j]!==j+1) return 'ลำดับผิดที่แถว '+(j+1);
      var last=sheets[sheets.length-1];

      for(k=0;k<sheets.length-1;k++) if(sheets[k].querySelector('.sh-sum,.sh-sign')) return 'หน้า '+(k+1)+' มียอดรวมทั้งที่ไม่ใช่หน้าสุดท้าย';
      for(k=1;k<sheets.length;k++){
        var tx=sheets[k].textContent;
        if(tx.indexOf(d.no)<0) return 'หน้า '+(k+1)+' ไม่มีเลขที่เอกสาร';
        if(tx.indexOf('หน้า '+(k+1)+' / '+r.pages)<0) return 'หน้า '+(k+1)+' ไม่มีเลขหน้า';
        if(!sheets[k].querySelector('.sh-items thead')) return 'หน้า '+(k+1)+' ไม่มีหัวตาราง';

      for(k=0;k<sheets.length-1;k++){

function modal(title,body,foot,after,wide){
  var ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML='<div class="modal'+(wide?' wide':'')+'">'+
    '<div class="modal-head"><h3>'+esc(title)+'</h3>'+
      '<button class="btn btn-sm btn-ghost" data-close="1">✕</button></div>'+
    '<div class="modal-body">'+body+'</div>'+
    (foot?'<div class="modal-foot">'+foot+'</div>':'')+'</div>';
  ov.addEventListener('click',function(e){
    if(e.target===ov || e.target.closest('[data-close]')) ov.remove();
  });
  document.getElementById('modal-root').appendChild(ov);
  if(after) after(ov);
  var first=ov.querySelector('input,select,textarea'); if(first) first.focus();
  return ov;
}

function download(name,text,mime){
  var blob=new Blob(['\ufeff'+text],{type:(mime||'text/plain')+';charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}
function stampNow(){
  return today().replace(/-/g,'')+'-'+String(new Date().getHours()).padStart(2,'0')+String(new Date().getMinutes()).padStart(2,'0');
}

/* รับได้ทั้งไฟล์สำรอง .json และไฟล์ระบบ .html ที่ฝังข้อมูลไว้ */
function parseDataFile(text){
  var t=text.replace(/^\ufeff/,'');
  var m=t.match(/<script type="application\/json" id="pc-embedded">([\s\S]*?)<\/script>/);
  if(m){
    if(!m[1].trim()) throw new Error('ไฟล์ระบบนี้ไม่มีข้อมูลฝังอยู่');
    return JSON.parse(m[1]);
  }
  return JSON.parse(t);
}
function doRestore(){
  var inp=document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json,.html,text/html';
  inp.addEventListener('change',function(){
    var f=inp.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var d=parseDataFile(String(fr.result));
        if(!d||typeof d!=='object'||!d.meta||!Array.isArray(d.products)) throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');
        openRestoreChoice(d);
      }catch(e){ toast('อ่านไฟล์ไม่สำเร็จ: '+e.message,'bad',5000); }
    };
    fr.readAsText(f);
  });
  inp.click();
}
