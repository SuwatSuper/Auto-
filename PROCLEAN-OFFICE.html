<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROCLEAN OFFICE — ระบบเอกสารและสต็อกสินค้า</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PROCLEAN OFFICE — Design tokens
   ink      #17191b  หมึกเอกสาร
   paper    #f4f3ef  พื้นแอป (ล้อกับแคตตาล็อก)
   surface  #ffffff  การ์ด / กระดาษเอกสาร
   rule     #dcd9d1  เส้นบาง
   seal     #1d4f4a  สีเน้น ใช้เฉพาะสถานะ active / ปุ่มหลัก
   ============================================================ */
:root{
  --ink:#17191b; --ink-2:#3d4145; --muted:#7b7870; --faint:#a7a49c;
  --paper:#f4f3ef; --surface:#ffffff; --rail:#1b1d1f;
  --rule:#dcd9d1; --rule-2:#eceae4;
  --seal:#1d4f4a; --seal-soft:#e6efed;
  --ok:#2f6b3f; --ok-soft:#e8f1ea;
  --warn:#8f5a15; --warn-soft:#f7eedd;
  --stop:#9d3232; --stop-soft:#f6e7e6;
  --info:#2b4f7a; --info-soft:#e7eef6;
  --shadow:0 1px 2px rgba(23,25,27,.06), 0 8px 24px rgba(23,25,27,.06);
  --fs:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'IBM Plex Sans Thai',Tahoma,'Leelawadee UI','Noto Sans Thai',sans-serif;
  font-size:var(--fs); color:var(--ink); background:var(--paper);
  -webkit-font-smoothing:antialiased; line-height:1.55;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--seal)}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- โครงหน้า ---------- */
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
.rail{background:var(--rail);color:#e8e6e0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.rail-head{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.rail-mark{display:flex;align-items:center;gap:10px}
.rail-mark svg{flex:0 0 auto}
.rail-name{font-size:12.5px;letter-spacing:.14em;font-weight:500;line-height:1.3}
.rail-sub{font-size:10.5px;color:#8d8a83;letter-spacing:.1em;margin-top:2px}
.rail nav{padding:14px 12px;flex:1;overflow:auto}
.nav-group{font-size:10.5px;color:#77746d;letter-spacing:.12em;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
  padding:8px 10px;border:0;background:transparent;color:#c9c6bf;border-radius:4px;
  cursor:pointer;text-align:left;font-size:13.5px;transition:background .12s,color .12s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item[aria-current="page"]{background:var(--seal);color:#fff;font-weight:500}
.nav-badge{font-size:11px;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.nav-item[aria-current="page"] .nav-badge{background:rgba(255,255,255,.22)}
.nav-badge.alert{background:var(--stop);color:#fff}
.rail-foot{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.09);font-size:11px;color:#7d7a73}
.main{min-width:0;display:flex;flex-direction:column}

/* ---------- แถบหัวเรื่อง ---------- */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding:22px 30px 16px;border-bottom:1px solid var(--rule);background:var(--paper);
  position:sticky;top:0;z-index:20}
.topbar h1{font-size:21px;font-weight:600;margin:0;letter-spacing:-.01em}
.topbar p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.topbar-actions{display:flex;gap:8px;flex-wrap:wrap}
.view{padding:24px 30px 60px;max-width:1240px;width:100%}

/* ---------- ปุ่ม ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:4px;
  border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-size:13px;
  font-weight:500;color:var(--ink-2);transition:border-color .12s,background .12s,color .12s;white-space:nowrap}
.btn:hover{border-color:#bdb9b0;background:#fbfaf8}
.btn-primary{background:var(--seal);border-color:var(--seal);color:#fff}
.btn-primary:hover{background:#174541;border-color:#174541;color:#fff}
.btn-danger{color:var(--stop);border-color:#e3cfcd}
.btn-danger:hover{background:var(--stop-soft);border-color:#d9b8b5}
.btn-sm{padding:4px 9px;font-size:12px}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:#eceae4;border-color:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- การ์ด / ตาราง ---------- */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:6px;box-shadow:var(--shadow)}
.card-head{padding:14px 18px;border-bottom:1px solid var(--rule-2);display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-head h2{margin:0;font-size:15px;font-weight:600}
.card-head .hint{font-size:12px;color:var(--muted);font-weight:400}
.card-body{padding:18px}
.card-body.flush{padding:0}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;font-size:11.5px;color:var(--muted);
  padding:10px 14px;border-bottom:1px solid var(--rule);background:#fbfaf8;white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
td.nowrap,th.nowrap{white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#fbfaf8}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.t-empty{padding:44px 20px;text-align:center;color:var(--muted)}
.t-empty strong{display:block;color:var(--ink);font-size:14px;margin-bottom:5px;font-weight:600}

/* ---------- ฟอร์ม ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field > label{font-size:12px;color:var(--ink-2);font-weight:500}
.field .help{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],select,textarea{
  padding:7px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--surface);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--seal);outline:none;box-shadow:0 0 0 3px var(--seal-soft)}
input[readonly]{background:#f6f5f2;color:var(--muted)}
textarea{resize:vertical;min-height:64px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 18px}
.check{display:flex;align-items:flex-start;gap:9px;font-size:13px}
.check input{margin-top:3px;width:auto}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input[type=text],.filters select{width:auto;min-width:150px}
.search{flex:1;min-width:220px!important}

/* ---------- ป้ายสถานะ ---------- */
.tag{display:inline-block;padding:2px 9px;border-radius:3px;font-size:11.5px;font-weight:500;white-space:nowrap}
.tag-draft{background:#f0eee9;color:#6f6c65}
.tag-sent{background:var(--info-soft);color:var(--info)}
.tag-ok{background:var(--ok-soft);color:var(--ok)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-stop{background:var(--stop-soft);color:var(--stop)}
.tag-seal{background:var(--seal-soft);color:var(--seal)}

/* ---------- ตัวเลขสรุป ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(198px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:15px 17px}
.kpi .k-label{font-size:12px;color:var(--muted)}
.kpi .k-value{font-size:25px;font-weight:600;margin-top:5px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .k-foot{font-size:11.5px;color:var(--faint);margin-top:3px}
.kpi.attention{border-color:#e0c7a8;background:#fdf9f2}
.kpi.attention .k-value{color:var(--warn)}

/* ---------- แถบเตือน ---------- */
.notice{display:flex;gap:11px;padding:12px 15px;border-radius:5px;font-size:13px;margin-bottom:18px;align-items:flex-start}
.notice b{display:block;margin-bottom:2px}
.notice-warn{background:var(--warn-soft);color:#5f3d0d;border:1px solid #e8d5b0}
.notice-info{background:var(--info-soft);color:#22406a;border:1px solid #cfdcea}
.notice-stop{background:var(--stop-soft);color:#7d2727;border:1px solid #e6c9c7}
.notice-ok{background:var(--ok-soft);color:#24512f;border:1px solid #c8ddcd}
.notice .x{margin-left:auto;background:none;border:0;cursor:pointer;color:inherit;opacity:.6;font-size:16px;line-height:1}

/* ---------- ตัวแก้ไขเอกสาร ---------- */
.editor{display:grid;grid-template-columns:1fr 316px;gap:20px;align-items:start}
.line-table th{font-size:11px}
.line-table td{padding:6px 8px}
.line-table input,.line-table select{padding:6px 8px;font-size:13px}
.line-table td:first-child{padding-left:14px;color:var(--faint);font-size:12px;width:30px}
.line-no{text-align:center}
.pick-wrap{position:relative}
.pick-list{position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:60;background:var(--surface);
  border:1px solid var(--rule);border-radius:5px;box-shadow:var(--shadow);max-height:264px;overflow:auto}
.pick-item{padding:8px 11px;cursor:pointer;border-bottom:1px solid var(--rule-2);font-size:13px}
.pick-item:last-child{border-bottom:0}
.pick-item:hover,.pick-item.on{background:var(--seal-soft)}
.pick-item .pi-1{display:flex;justify-content:space-between;gap:10px}
.pick-item .pi-2{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;margin-top:1px}
.totals{display:flex;flex-direction:column;gap:7px;padding:14px 18px;font-size:13px}
.totals .row{display:flex;justify-content:space-between;gap:14px;align-items:center}
.totals .row.grand{border-top:1px solid var(--rule);margin-top:5px;padding-top:10px;font-size:17px;font-weight:600}
.totals input{width:104px;text-align:right;padding:4px 8px}
.side-stack{display:flex;flex-direction:column;gap:16px;position:sticky;top:88px}

/* ---------- โมดัล ---------- */
.overlay{position:fixed;inset:0;background:rgba(23,25,27,.42);z-index:200;
  display:flex;align-items:flex-start;justify-content:center;padding:34px 18px;overflow:auto}
.modal{background:var(--surface);border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.28);
  width:100%;max-width:620px;margin:auto 0}
.modal.wide{max-width:900px}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;
  justify-content:space-between;align-items:center;gap:12px}
.modal-head h3{margin:0;font-size:16px;font-weight:600}
.modal-body{padding:20px;max-height:70vh;overflow:auto}
.modal-foot{padding:14px 20px;border-top:1px solid var(--rule);display:flex;
  justify-content:flex-end;gap:9px;flex-wrap:wrap}

/* ---------- toast ---------- */
#toasts{position:fixed;right:20px;bottom:20px;z-index:400;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--rail);color:#fff;padding:11px 16px;border-radius:5px;font-size:13px;
  box-shadow:0 8px 26px rgba(0,0,0,.26);max-width:340px}
.toast.bad{background:var(--stop)}
.toast.good{background:var(--ok)}

/* ============================================================
   กระดาษเอกสาร A4 — ขาวดำ ไม่มีพื้นสีเทา เพื่อพิมพ์ได้คมชัด
   ============================================================ */
.sheet-stage{background:#8d8b86;padding:26px;display:flex;flex-direction:column;
  align-items:center;gap:22px;min-height:100%}
/* กระดาษสูงคงที่หนึ่งหน้า A4 เสมอ — ตัวจัดหน้า (layoutDocInto) วัดความสูงจริง
   แล้วแบ่งรายการไปหน้าถัดไปเอง จึงไม่มีเนื้อหาล้นหรือซ้อนข้ามหน้า
   .sheet-free ใช้เฉพาะกรณีเนื้อหาหนึ่งก้อนยาวเกินหนึ่งหน้าจริง ๆ (เช่น หมายเหตุยาวมาก) */
.sheet{width:210mm;height:297mm;background:#fff;color:#000;padding:14mm 15mm 16mm;overflow:hidden;
  box-shadow:0 6px 30px rgba(0,0,0,.3);position:relative;display:flex;flex-direction:column;flex:0 0 auto}
.sheet.sheet-free{height:auto;min-height:297mm;overflow:visible}
.sheet *{color:#000}
/* หัวกระดาษย่อของหน้าต่อเนื่อง */
.sh-top-c .sh-co-name{font-size:12.5px}
.sh-top-c .sh-title h2{font-size:15px}
.sh-cmeta{display:flex;justify-content:space-between;gap:8mm;margin-top:6px;font-size:9.6px;line-height:1.5}
.sh-cmeta b{font-weight:600}
/* แถวยอดยกมา / ยอดยกไป */
.sh-items tr.carry td{border-top:.8px solid #000;border-bottom:.8px solid #000;font-weight:600;
  padding:4px;font-size:9.6px}
.sh-items tr.carry td.cl{text-align:right;letter-spacing:.02em}
.sh-cont{margin-top:4px;text-align:right;font-size:9px;letter-spacing:.04em}
/* เอกสารหลายหน้า: ไม่ต้องเว้นช่องว่างขั้นต่ำใต้ตาราง จะได้ใส่รายการต่อหน้าได้มากขึ้น */
.sheet.paged .sh-fill{min-height:2mm}
.sh-top{display:flex;justify-content:space-between;gap:14mm;align-items:flex-start}
.sh-co{display:flex;gap:9px;align-items:flex-start;max-width:105mm}
.sh-co-name{font-size:14.5px;font-weight:600;letter-spacing:.01em}
.sh-co-en{font-size:10px;letter-spacing:.16em;color:#000;margin-top:1px}
.sh-co-meta{font-size:9.6px;line-height:1.62;margin-top:6px}
.sh-title{text-align:right;flex:0 0 auto}
.sh-title h2{margin:0;font-size:19px;font-weight:600;letter-spacing:.01em}
.sh-title .en{font-size:9.5px;letter-spacing:.2em;margin-top:2px}
.sh-copy{font-size:9.5px;margin-top:7px;border:1px solid #000;display:inline-block;padding:1px 8px}
/* บรรทัดรองของเอกสารภาษาอังกฤษเป็นภาษาไทย จึงต้องยกเลิกการยืดระยะตัวอักษร
   ซึ่งออกแบบไว้สำหรับตัวพิมพ์ใหญ่ภาษาอังกฤษ ไม่เช่นนั้นคำไทยจะอ่านยาก */
.tag-en{background:#1b1d1f;color:#fff;letter-spacing:.08em}
.sh-co-en.l-th{letter-spacing:.01em;font-size:10.8px;opacity:.78}
.sh-title .en.l-th{letter-spacing:.01em;font-size:11px;opacity:.78}
.sheet.lang-en .sh-items .c-dil{width:32mm}
.sheet.lang-en .sh-items .c-pack{width:24mm}
.sh-rule{border:0;border-top:1.4px solid #000;margin:9px 0 0}
.sh-meta{display:flex;gap:9mm;margin-top:9px}
.sh-party{flex:1;min-width:0}
.sh-lbl{font-size:9px;letter-spacing:.1em;border-bottom:.6px solid #000;padding-bottom:2px;margin-bottom:5px}
.sh-party-name{font-size:11.4px;font-weight:600}
.sh-party-body{font-size:9.6px;line-height:1.62;margin-top:2px}
.sh-facts{flex:0 0 62mm}
.sh-facts table{width:100%;border-collapse:collapse}
.sh-facts td{border:0;padding:1.6px 0;font-size:9.6px;vertical-align:top}
.sh-facts td:first-child{color:#000;width:34%}
.sh-facts td:last-child{text-align:right;font-weight:500}
.sh-items{width:100%;border-collapse:collapse;margin-top:11px}
.sh-items th{background:transparent;border-top:1px solid #000;border-bottom:1px solid #000;
  padding:5px 4px;font-size:9.2px;letter-spacing:.04em;color:#000;font-weight:600}
.sh-items td{border-bottom:.5px solid #c9c9c9;padding:4px;font-size:9.8px;vertical-align:top}
.sh-items .c-no{width:9mm;text-align:center}
.sh-items .c-qty{width:17mm;text-align:right}
.sh-items .c-unit{width:14mm;text-align:center}
.sh-items .c-price{width:22mm;text-align:right}
.sh-items .c-disc{width:17mm;text-align:right}
.sh-items .c-amt{width:26mm;text-align:right}
.sh-items .it-name{font-weight:500}
.sh-items .it-sub{font-size:8.8px;color:#000;opacity:.68;margin-top:1px}
.sh-fill{flex:1 1 auto;min-height:8mm}
.sh-sum{display:flex;gap:9mm;margin-top:9px;align-items:flex-start}
.sh-words{flex:1;border:1px solid #000;padding:6px 9px;font-size:10px;min-height:14mm}
.sh-words .w-l{font-size:8.6px;letter-spacing:.08em;margin-bottom:2px}
.sh-words .w-v{font-weight:600;font-size:11px}
.sh-tot{flex:0 0 66mm}
.sh-tot table{width:100%;border-collapse:collapse}
.sh-tot td{padding:2.6px 0;font-size:10px;border:0}
.sh-tot td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sh-tot tr.grand td{border-top:1px solid #000;border-bottom:2.4px double #000;
  padding:5px 0;font-size:12.4px;font-weight:600}
.sh-note{margin-top:9px;font-size:9.4px;line-height:1.6;border-top:.6px solid #000;padding-top:6px}
.sh-note .n-l{font-size:8.6px;letter-spacing:.08em;margin-bottom:2px}
.sh-sign{display:flex;gap:8mm;margin-top:11mm}
.sh-sign div{flex:1;text-align:center;font-size:9.4px}
.sh-sign .line{border-bottom:.7px solid #000;height:12mm;margin-bottom:4px}
.sh-sign .cap{opacity:.75;font-size:8.8px;margin-top:1px}
/* สามระดับความหนาแน่น ระบบเลือกให้เองโดยวัดความสูงจริง */
/* ---------- ใบส่งตัวอย่าง: คอลัมน์และแถบไม่คิดมูลค่า ---------- */
.sh-items .c-pack{width:26mm}
.sh-items .c-dil{width:34mm;text-align:center}
.sh-nocharge{border:1.4px solid #000;padding:7px 10px;margin-top:9px;text-align:center}
.sh-nocharge .nc-1{font-size:12px;font-weight:600;letter-spacing:.02em}
.sh-nocharge .nc-2{font-size:8.8px;margin-top:2px;letter-spacing:.04em}
.sh-fb{margin-top:8px;border-top:.6px solid #000;padding-top:6px}
.sh-fb .n-l{font-size:8.6px;letter-spacing:.08em;margin-bottom:5px}
.sh-fb .fb-line{border-bottom:.5px dotted #8a8a8a;height:6.5mm}
.sheet.dense .sh-fb .fb-line{height:5mm}
.sheet.ultra .sh-fb .fb-line{height:4mm}
.sheet.dense .sh-nocharge{padding:5px 9px;margin-top:6px}
.sheet.ultra .sh-nocharge{padding:4px 8px;margin-top:5px}
.sheet.ultra .sh-nocharge .nc-1{font-size:11px}

/* ---------- คู่มือการใช้งานผลิตภัณฑ์ ---------- */
.sheet.gd{--gd:9.5px}
.sheet.gd.dense{--gd:8.8px}
.sheet.gd.ultra{--gd:8.1px}
.gd-hero{margin-top:9px}
.gd-brand{display:inline-block;border:1px solid #000;padding:1px 7px;font-size:8.6px;letter-spacing:.14em}
.gd-name{font-size:20px;font-weight:600;margin-top:5px;line-height:1.2}
.gd-en{font-size:9px;letter-spacing:.18em;margin-top:2px}
.gd-tag{font-size:11px;margin-top:4px}
.gd-packs{font-size:8.8px;margin-top:3px;opacity:.75}
.sheet.gd.dense .gd-name{font-size:17px}
.sheet.gd.ultra .gd-name{font-size:15px}
.gd-rate{border:1px solid #000;padding:6px 10px;margin-top:8px;
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gd-rate-l{font-size:8.6px;letter-spacing:.1em}

<body>
<div id="app"></div>
<div id="modal-root"></div>

<!-- ข้อมูลที่ฝังมากับไฟล์ (สร้างจากปุ่ม “ดาวน์โหลดไฟล์ระบบพร้อมข้อมูล”) ไฟล์ต้นฉบับเว้นว่างไว้ -->
<script type="application/json" id="pc-embedded"></script>
<script>
/* ================================================================
   PROCLEAN OFFICE v1.1
   ระบบออกเอกสารธุรกิจ + จัดการสต็อก  (ไฟล์เดียว ทำงานออฟไลน์)
   โครงสร้าง:  Storage → Model → Engine → View → Router
   v1.1 (ตรวจบั๊ก): แบ่งหน้าเอกสารจริงพร้อมหัวกระดาษ/ยอดยกไปทุกหน้า · วันที่ตามเวลาไทย
        · ไม่เขียนทับข้อมูลที่อ่านไม่ได้ · ชุดทดสอบไม่แตะข้อมูลจริง · ลูกหนี้ไม่นับซ้ำ
        · ใบเสร็จปรับสถานะใบแจ้งหนี้ให้อัตโนมัติ · ซิงก์ข้อมูลเมื่อเปิดหลายหน้าต่าง
        ข้อมูลรุ่น 1.0 ใช้ต่อได้ทันที (คีย์จัดเก็บเดิม เพิ่มเฉพาะฟิลด์ใหม่ ไม่ลบของเดิม)
   ================================================================ */
(function(){
'use strict';

/* ซอร์สของหน้านี้ ณ ตอนเปิด (ก่อนวาดหน้าจอ) ใช้สร้างไฟล์ระบบพร้อมข้อมูล */
var PAGE_SRC=(function(){
  try{ return '<!DOCTYPE html>\n'+document.documentElement.outerHTML; }catch(e){ return ''; }
})();
/* ข้อมูลที่ฝังมากับไฟล์ — อ่านอย่างเดียว ไม่เคยเขียนทับข้อมูลในเครื่องโดยอัตโนมัติ */
var EMBEDDED=(function(){
  try{
    var el=document.getElementById('pc-embedded');
    var t=el?String(el.textContent||'').trim():'';
    if(!t) return null;
    var o=JSON.parse(t);
    return (o && typeof o==='object' && o.meta && Array.isArray(o.products)) ? o : null;
  }catch(e){ return null; }
})();
var EMBED_STATE='';   // '' ไม่มีข้อมูลฝัง · loaded โหลดเข้าเครื่องแล้ว · differs มีรายการที่เครื่องนี้ยังไม่มี · same · dismissed

/* ---------------------------------------------------------------
   1. ชั้นเก็บข้อมูล (Storage Layer)
   พยายามใช้ localStorage ก่อน หากเบราว์เซอร์ปิดกั้น (เช่น เปิดจาก
   ไฟล์ในบางเบราว์เซอร์) จะสลับเป็นหน่วยความจำชั่วคราวและแจ้งเตือน
   ให้ผู้ใช้สำรองข้อมูลเป็นไฟล์ทันที
--------------------------------------------------------------- */
var KEY='proclean.office.v1';
var Store=(function(){
  var mem=null, persistent=false, canPersist=false;
  /* locked: ข้อมูลเดิมในเครื่องอ่านไม่ได้ — ห้ามเขียนทับจนกว่าผู้ใช้จะเลือกเองว่าจะกู้คืนหรือเริ่มใหม่
     sandbox: ระหว่างรันชุดตรวจสอบระบบ เขียนลงหน่วยความจำแยกเท่านั้น ไม่แตะข้อมูลจริง */
  var locked=false, sandbox=false, sbMem=null;
  try{
    var t='__pc_test__';
    window.localStorage.setItem(t,'1');
    window.localStorage.removeItem(t);
    persistent=canPersist=true;
  }catch(e){ persistent=canPersist=false; }
  function rawGet(){
    if(sandbox) return sbMem;
    return persistent ? window.localStorage.getItem(KEY) : mem;
  }
  return {
    persistent:function(){return persistent && !locked;},
    locked:function(){return locked;},
    lock:function(on){ locked=!!on; },
    sandbox:function(on){ sandbox=!!on; sbMem=null; },
    inSandbox:function(){ return sandbox; },
    raw:function(){ try{ return rawGet(); }catch(e){ return null; } },
    /* อ่านแบบแยกสถานะ: ไม่มีข้อมูล / อ่านได้ / มีข้อมูลแต่เสียหาย */
    readState:function(){
      var raw=null;
      try{ raw=rawGet(); }catch(e){ return {state:'empty'}; }
      if(raw==null || raw==='') return {state:'empty'};
      try{
        var obj=JSON.parse(raw);
        if(!obj || typeof obj!=='object' || !obj.meta) return {state:'corrupt', raw:raw};
        return {state:'ok', data:obj};
      }catch(e){ return {state:'corrupt', raw:raw}; }
    },
    read:function(){
      var r=this.readState();
      return r.state==='ok' ? r.data : null;
    },
    write:function(obj){
      var raw=JSON.stringify(obj);
      if(sandbox){ sbMem=raw; return true; }
      if(locked){ mem=raw; return false; }
      /* เคยเต็มแล้วถอยไปหน่วยความจำ: ลองกลับไปบันทึกถาวรทุกครั้ง เผื่อผู้ใช้ลดขนาดข้อมูลแล้ว */
      if(canPersist){
        try{
          window.localStorage.setItem(KEY,raw);
          if(!persistent){ persistent=true; toast('กลับมาบันทึกถาวรในเครื่องได้แล้ว','good',5000); }
          mem=null;
          return true;
        }catch(e){
          var was=persistent;
          persistent=false; mem=raw;
          if(was) toast('พื้นที่จัดเก็บของเบราว์เซอร์เต็ม ระบบสลับเป็นโหมดชั่วคราว กรุณาสำรองข้อมูลทันที','bad',9000);
          return false;
        }
      }
      mem=raw;
      return false;
    },
    /* ขนาดข้อมูลโดยประมาณ (ตัวอักษร) ใช้เตือนก่อนพื้นที่เต็ม — เบราว์เซอร์ส่วนใหญ่ให้ราว 5 ล้านตัวอักษร */
    size:function(){ try{ var r=rawGet(); return r?r.length:0; }catch(e){ return 0; } },
    clear:function(){
      if(sandbox){ sbMem=null; return; }
      try{ if(canPersist) window.localStorage.removeItem(KEY); }catch(e){}
      mem=null; locked=false;
    }
  };
})();
var STORE_LIMIT=5*1024*1024;
function usagePct(){ return Math.min(100,Math.round(Store.size()/STORE_LIMIT*100)); }
function usageText(){
  var kb=Math.round(Store.size()/1024);
  return (kb>=1024?(kb/1024).toFixed(2)+' MB':kb+' KB')+' (ประมาณ '+usagePct()+'% ของพื้นที่เบราว์เซอร์)';
}

/* ---------------------------------------------------------------
   2. ยูทิลิตี้
--------------------------------------------------------------- */
function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }
function r2(n){ return Math.round((num(n)+Number.EPSILON)*100)/100; }
function money(n,dp){ dp=(dp===undefined)?2:dp;
  return num(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function qtyFmt(n){ var v=num(n); return v%1===0 ? v.toLocaleString('en-US') : money(v,2); }
function esc(s){ return String(s==null?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* วันที่ทั้งหมดคิดตามเวลาท้องถิ่นของเครื่อง (ประเทศไทย UTC+7)
   ห้ามใช้ toISOString() เพราะเป็นเวลา UTC — เดิมทำให้ช่วง 00:00–06:59 น. ได้วันที่ของเมื่อวาน
   และทำให้วันครบกำหนดทุกฉบับสั้นไป 1 วัน (เครดิต 30 วันกลายเป็น 29 วัน) */
function isoLocal(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function validIso(iso){ return /^\d{4}-\d{2}-\d{2}$/.test(String(iso||'')) && !isNaN(new Date(iso+'T00:00:00').getTime()); }
function today(){ return isoLocal(new Date()); }
function addDays(iso,n){
  if(!validIso(iso)) return '';
  var p=iso.split('-');
  var d=new Date(+p[0], +p[1]-1, +p[2]+Math.round(num(n)));
  return isoLocal(d);
}
/* นับจำนวนวันตามปฏิทิน ใช้ UTC ภายในเพื่อไม่ให้การปรับเวลาออมแสงของบางประเทศทำให้คลาด */
function daysBetween(a,b){
  if(!validIso(a)||!validIso(b)) return NaN;
  var x=a.split('-'), y=b.split('-');
  return Math.round((Date.UTC(+y[0],+y[1]-1,+y[2])-Date.UTC(+x[0],+x[1]-1,+x[2]))/86400000);
}

var TH_MONTH=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
var TH_MONTH_S=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function thDate(iso,style){
  if(!iso) return '-';
  var p=iso.split('-'); if(p.length<3) return iso;
  var y=+p[0], m=+p[1]-1, d=+p[2];
  if(style==='long')  return d+' '+TH_MONTH[m]+' พ.ศ. '+(y+543);
  if(style==='short') return d+' '+TH_MONTH_S[m]+' '+String(y+543).slice(2);
  return d+' '+TH_MONTH_S[m]+' '+(y+543);
}
function beYear(iso){ return (+String(iso).slice(0,4))+543; }

/* แปลงจำนวนเงินเป็นตัวอักษรภาษาไทย (มาตรฐานเอกสารราชการ/ธุรกิจ) */
var TH_DIGIT=['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
var TH_PLACE=['','สิบ','ร้อย','พัน','หมื่น','แสน','ล้าน'];
/* hasHigher = ตัวเลขชุดนี้เป็นส่วนท้ายของจำนวนที่ใหญ่กว่า (หลักล้านขึ้นไป)
   เช่น 10,000,001 ต้องอ่าน “สิบล้านเอ็ด” ไม่ใช่ “สิบล้านหนึ่ง” */
function thNumWords(intStr,hasHigher){
  intStr=String(intStr).replace(/^0+(?=\d)/,'');
  if(intStr==='0'||intStr==='') return 'ศูนย์';
  if(intStr.length>7){
    var head=intStr.slice(0,intStr.length-6), tail=intStr.slice(-6);
    return thNumWords(head,hasHigher)+'ล้าน'+(/^0+$/.test(tail)?'':thNumWords(tail,true));
  }
  var out='', L=intStr.length;
  for(var i=0;i<L;i++){
    var d=+intStr[i], pos=L-i-1;
    if(d===0) continue;
    if(pos===0){
      if(d===1 && (L>1 || hasHigher)) out+='เอ็ด';
      else out+=TH_DIGIT[d];
    }else if(pos===1){
      if(d===1) out+='สิบ';
      else if(d===2) out+='ยี่สิบ';
      else out+=TH_DIGIT[d]+'สิบ';
    }else{
      out+=TH_DIGIT[d]+TH_PLACE[pos];
    }
  }
  return out;
}
function bahtText(amount){
  var neg = num(amount)<0;
  var a=Math.abs(r2(amount));
  var baht=Math.floor(a);
  var satang=Math.round((a-baht)*100);
  if(satang===100){ baht+=1; satang=0; }
  var s=(neg?'ลบ':'')+thNumWords(String(baht))+'บาท';
  s += satang===0 ? 'ถ้วน' : thNumWords(String(satang))+'สตางค์';
  return s;
}

/* ---------------------------------------------------------------
   2b. กลไกเอกสารสองภาษา (Bilingual document engine)
   เอกสารทุกฉบับมีฟิลด์ lang = 'th' | 'en'

var DOC_LANGS=['th','en'];
function normLang(v){ return v==='en' ? 'en' : 'th'; }

var EN_MONTH=['January','February','March','April','May','June',
  'July','August','September','October','November','December'];
var EN_MONTH_S=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* วันที่แบบสากล ใช้ปีคริสต์ศักราชเสมอ เพราะคู่ค้าต่างชาติไม่ได้ใช้ปีพุทธศักราช
   การพิมพ์ปี พ.ศ. ลงเอกสารภาษาอังกฤษทำให้ลูกค้าอ่านวันครบกำหนดชำระผิดไป 543 ปี */
function enDate(iso,style){
  if(!iso) return '-';
  var p=String(iso).split('-'); if(p.length<3) return String(iso);
  var y=+p[0], m=+p[1]-1, d=+p[2];
  if(!(m>=0&&m<=11)||!isFinite(y)||!isFinite(d)) return String(iso);
  if(style==='long') return d+' '+EN_MONTH[m]+' '+y;
  return String(d).padStart(2,'0')+' '+EN_MONTH_S[m]+' '+y;
}
function fmtDate(lang,iso,style){ return normLang(lang)==='en' ? enDate(iso,style) : thDate(iso,style); }

/* แปลงจำนวนเงินเป็นตัวอักษรภาษาอังกฤษ ตามรูปแบบที่ใช้ในเอกสารการค้าของไทย */
var EN_ONES=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
  'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
var EN_TENS=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
var EN_SCALE=['','Thousand','Million','Billion','Trillion'];
function enTriple(n){
  var out=[], h=Math.floor(n/100), r=n%100;
  if(h) out.push(EN_ONES[h],'Hundred');
  if(r){
    if(r<20) out.push(EN_ONES[r]);
    else{
      var t=Math.floor(r/10), o=r%10;
      out.push(o?EN_TENS[t]+'-'+EN_ONES[o]:EN_TENS[t]);
    }
  }
  return out.join(' ');
}
function enNumWords(n){
  n=Math.floor(Math.abs(num(n)));
  if(n===0) return 'Zero';
  var parts=[], i=0;
  while(n>0 && i<EN_SCALE.length){
    var tri=n%1000;
    if(tri) parts.unshift(enTriple(tri)+(EN_SCALE[i]?' '+EN_SCALE[i]:''));
    n=Math.floor(n/1000); i++;
  }
  return parts.join(' ');
}
function bahtTextEn(amount){
  var neg=num(amount)<0;
  var a=Math.abs(r2(amount));
  var baht=Math.floor(a);
  var satang=Math.round((a-baht)*100);
  if(satang===100){ baht+=1; satang=0; }
  var s=(neg?'Minus ':'')+enNumWords(baht)+' Baht';
  s += satang===0 ? ' Only' : ' and '+enNumWords(satang)+' Satang';
  return s;
}
function moneyWords(lang,amount){ return normLang(lang)==='en' ? bahtTextEn(amount) : bahtText(amount); }

/* อ่านข้อความจากตาราง ถ้าคีย์ภาษาอังกฤษหาย ให้ถอยไปใช้ภาษาไทยแทนการพิมพ์คีย์ดิบ */
function TT(lang,k){
  var d=LANG[normLang(lang)]||LANG.th;
  if(d[k]!==undefined) return d[k];
  return LANG.th[k]!==undefined ? LANG.th[k] : k;
}
/* อ่านฟิลด์ของอ็อบเจกต์ตามภาษา ถ้าฟิลด์อังกฤษว่างให้ถอยไปใช้ฟิลด์ไทย */
function fx(lang,obj,thKey,enKey){
  if(!obj) return '';
  if(normLang(lang)==='en'){
    var v=obj[enKey];
    if(v!=null && String(v).trim()!=='') return v;
  }
  var t=obj[thKey];
  return t==null?'':t;
}
/* อ่านฟิลด์ของบรรทัดสินค้า โดยถอยไปหาทะเบียนสินค้าก่อนแล้วจึงถอยไปภาษาไทย
   ใช้กับเอกสารเก่าที่บันทึกไว้ก่อนมีโหมดภาษาอังกฤษ ซึ่งบรรทัดยังไม่มีฟิลด์อังกฤษ */
function fxItem(lang,it,p,thKey,enKey){
  if(normLang(lang)==='en'){
    var v=it[enKey];
    if(v==null||String(v).trim()==='') v=p?p[enKey]:'';
    if(v!=null && String(v).trim()!=='') return v;
  }
  var t=it[thKey];
  if((t==null||String(t).trim()==='')&&p) t=p[thKey];
  return t==null?'':t;
}

function toast(msg,kind,ms){
  var box=document.getElementById('toasts'); if(!box) return;
  var el=document.createElement('div');
  el.className='toast'+(kind?' '+kind:''); el.textContent=msg;
  box.appendChild(el);
  setTimeout(function(){ el.remove(); }, ms||3200);
}

var DB=null;
function save(){ DB.meta.savedAt=new Date().toISOString(); Store.write(DB); }
/* ปรับโครงสร้างข้อมูลให้ครบทุกฟิลด์ที่ระบบรุ่นนี้ต้องใช้
   ใช้ร่วมกันทั้งตอนเปิดระบบ ตอนกู้คืนจากไฟล์สำรอง และตอนรับข้อมูลจากหน้าต่างอื่น
   หลักการ: เติมเฉพาะส่วนที่ขาด ไม่ลบและไม่เขียนทับข้อมูลที่ผู้ใช้บันทึกไว้ */
function migrate(x){
  if(!x.meta || typeof x.meta!=='object') x.meta={version:1, createdAt:new Date().toISOString()};
  ['customers','suppliers','products','guides','docs','moves'].forEach(function(k){
    if(!Array.isArray(x[k])) x[k]=[];
    // ตัดเฉพาะช่องว่างเปล่า (null) ที่ไม่ใช่ข้อมูลจริง ป้องกันระบบล่มทั้งหน้า
    x[k]=x[k].filter(function(v){ return v && typeof v==='object'; });
  });
  if(!x.counters || typeof x.counters!=='object') x.counters={};
  var fresh=seedDB();
  if(!x.settings || typeof x.settings!=='object') x.settings={};
  for(var sk in fresh.settings){ if(x.settings[sk]===undefined) x.settings[sk]=fresh.settings[sk]; }
  if(!x.company || typeof x.company!=='object') x.company={};
  var c=fresh.company;
  for(var k in c){ if(x.company[k]===undefined) x.company[k]=c[k]; }

  /* ย้ายข้อมูลรุ่นเก่า: เติมคู่มือการใช้งานและผูกรหัสคู่มือเข้ากับสินค้าเดิม
     เติมเฉพาะคู่มือที่ยังไม่มี ไม่เขียนทับฉบับที่ผู้ใช้แก้ไขเองไว้แล้ว */
  var haveCode={}; x.guides.forEach(function(g){ haveCode[g.code]=1; });
  seedGuides().forEach(function(g){ if(!haveCode[g.code]) x.guides.push(g); });
  /* เดาเฉพาะสินค้าที่ยังไม่เคยกำหนด (undefined) — ถ้าผู้ใช้เลือก “ไม่มีคู่มือ” ไว้ (ค่าว่าง) จะไม่ไปเปลี่ยน */
  x.products.forEach(function(p){
    if(p.guideCode===undefined || p.guideCode===null) p.guideCode=guessGuideCode(p);
  });

  /* ย้ายข้อมูลรุ่นเก่า: เติมฟิลด์ภาษาอังกฤษที่ยังไม่มี
     เติมเฉพาะช่องที่ว่างจริง ไม่เขียนทับสิ่งที่ผู้ใช้พิมพ์เอง */
  x.products.forEach(function(p){
    if(p.nameEn===undefined||p.nameEn==='')       p.nameEn=EN_NAME[p.guideCode]||'';
    if(p.packEn===undefined||p.packEn==='')       p.packEn=enPack(p.pack);
    if(p.unitEn===undefined||p.unitEn==='')       p.unitEn=enUnit(p.unit);
    if(p.dilutionEn===undefined||p.dilutionEn==='') p.dilutionEn=enDilution(p.dilution);
  });
  ['customers','suppliers'].forEach(function(kk){
    x[kk].forEach(function(v){
      if(v.name===undefined||v.name===null) v.name='';
      if(v.nameEn===undefined)  v.nameEn='';
      if(v.addrEn1===undefined) v.addrEn1='';
      if(v.addrEn2===undefined) v.addrEn2='';
      if(v.branchEn===undefined)v.branchEn='';
      if(v.docLang===undefined) v.docLang='';
    });
  });
  /* เอกสารที่บันทึกไว้ก่อนมีโหมดภาษา ถือเป็นเอกสารภาษาไทยทั้งหมด
     ตั้งค่าให้ชัดเจน เพื่อไม่ให้เอกสารเก่าเปลี่ยนหน้าตาเมื่อผู้ใช้เปลี่ยนค่าตั้งต้น
     และกันฟิลด์ที่ขาดหายไม่ให้หน้ารายการเอกสารล่ม */
  x.docs.forEach(function(d){
    d.lang=normLang(d.lang);
    if(!Array.isArray(d.items)) d.items=[];
    if(typeof d.no!=='string') d.no=String(d.no==null?'':d.no);
    if(typeof d.date!=='string') d.date='';
    if(!d.status && STATUS[d.type]) d.status=STATUS[d.type][0].k;
  });
  return x;
}

/* ข้อมูลเดิมที่อ่านไม่ได้ เก็บไว้ในหน่วยความจำเพื่อให้ผู้ใช้ดาวน์โหลดไปกู้คืน */
var LOAD_PROBLEM=null;
function load(){
  var r=Store.readState();
  if(r.state==='corrupt'){
    /* เดิมระบบจะสร้างฐานข้อมูลใหม่แล้วบันทึกทับทันที ทำให้ข้อมูลเดิมหายถาวร
       ตอนนี้ล็อกการบันทึกไว้ก่อน จนกว่าผู้ใช้จะดาวน์โหลดเก็บ กู้คืน หรือยืนยันเริ่มใหม่เอง */
    LOAD_PROBLEM={raw:r.raw, at:new Date().toISOString()};
    Store.lock(true);
    DB=migrate(seedDB());
    return;
  }
  if(r.state==='empty'){
    /* เครื่องนี้ยังไม่มีข้อมูล แต่ไฟล์มีข้อมูลฝังมา → ใช้ข้อมูลจากไฟล์ทั้งหมด */
    if(EMBEDDED && !Store.inSandbox()){
      DB=migrate(JSON.parse(JSON.stringify(EMBEDDED))); recomputeStock();
      EMBED_STATE='loaded'; save(); return;
    }
    DB=seedDB(); save(); return;
  }
  DB=migrate(r.data);
  /* เครื่องนี้มีข้อมูลอยู่แล้ว: ไม่ทับเด็ดขาด แค่ตรวจว่าไฟล์มีรายการที่เครื่องยังไม่มีหรือไม่ แล้วให้ผู้ใช้เลือกเอง */
  if(EMBEDDED && !Store.inSandbox() && EMBED_STATE!=='dismissed'){
    EMBED_STATE = mergePreview(DB, EMBEDDED).total>0 ? 'differs' : 'same';
  }
}

/* ---------------------------------------------------------------
   5b. รวมข้อมูลจากไฟล์อื่น (ไฟล์สำรอง .json หรือไฟล์ระบบที่ฝังข้อมูล)
   หลักการ: เพิ่มเฉพาะรายการที่เครื่องนี้ยังไม่มี ไม่ลบและไม่ทับของเดิม
   - เอกสารเดียวกัน (id เดียวกัน) ใช้ฉบับที่แก้ไขล่าสุด
   - สินค้าจับคู่ด้วย id ก่อน แล้วจึงด้วยรหัสสินค้า (SKU) เพื่อไม่ให้สินค้าซ้ำ
     ราคาและข้อมูลสินค้าในเครื่องนี้คงเดิม
   - ประวัติสต็อกที่เกิดจากเอกสาร ใช้ตามฉบับเอกสารที่ถูกเลือก (กันตัดสต็อกซ้ำ)
   - ข้อมูลกิจการและค่าตั้งค่าในเครื่องนี้คงเดิม เติมเฉพาะช่องที่ยังว่าง
--------------------------------------------------------------- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function isBlankDB(x){
  return !x.docs.length && !x.customers.length && !x.suppliers.length && !x.moves.length &&
    x.products.every(function(p){ return !num(p.price) && !num(p.cost); });
}
function mergeData(base,inc,dry){
  var rep={docs:0, docsUpdated:0, customers:0, suppliers:0, products:0, productsMatched:0,
           moves:0, guides:0, dupNos:[], total:0};
  /* สินค้า: หา id ปลายทางของสินค้าที่เข้ามา */
  var pid={}, bySku={}, baseIds={};
  base.products.forEach(function(p){ baseIds[p.id]=1; if(p.sku) bySku[String(p.sku).trim().toUpperCase()]=p.id; });
  var newProducts=[];
  inc.products.forEach(function(p){
    if(!p || !p.id) return;
    if(baseIds[p.id]){ pid[p.id]=p.id; return; }
    var k=String(p.sku||'').trim().toUpperCase();
    if(k && bySku[k]){ pid[p.id]=bySku[k]; rep.productsMatched++; return; }
    pid[p.id]=p.id; newProducts.push(p); rep.products++;
  });
  function mapPid(v){ return (v && pid[v]) ? pid[v] : v; }

  /* ทะเบียนลูกค้า / ผู้ขาย */
  var addParties={customers:[], suppliers:[]};
  ['customers','suppliers'].forEach(function(k){
    var have={}; base[k].forEach(function(x){ have[x.id]=1; });
    inc[k].forEach(function(x){ if(x && x.id && !have[x.id]){ addParties[k].push(x); rep[k]++; } });
  });

  /* เอกสาร */
  var dIdx={}; base.docs.forEach(function(d,i){ dIdx[d.id]=i; });
  var addDocs=[], updDocs=[], touched={};
  inc.docs.forEach(function(d){
    if(!d || !d.id) return;
    if(dIdx[d.id]===undefined){ addDocs.push(d); touched[d.id]=1; rep.docs++; }
    else if(String(d.updatedAt||'') > String(base.docs[dIdx[d.id]].updatedAt||'')){
      updDocs.push(d); touched[d.id]=1; rep.docsUpdated++;
    }
  });

  /* ประวัติสต็อก */
  var haveMv={}; base.moves.forEach(function(m){ haveMv[m.id]=1; });
  var addMoves=[];
  inc.moves.forEach(function(m){
    if(!m || !m.id) return;
    if(m.refId){ if(touched[m.refId]) addMoves.push(m); return; }   // ตามเอกสารที่ถูกเลือก
    if(!haveMv[m.id]) addMoves.push(m);
  });
  rep.moves=addMoves.length;

  /* คู่มือ */
  var haveG={}; base.guides.forEach(function(g){ haveG[g.code]=1; });
  var addGuides=inc.guides.filter(function(g){ return g && g.code && !haveG[g.code]; });
  rep.guides=addGuides.length;

  rep.total=rep.docs+rep.docsUpdated+rep.customers+rep.suppliers+rep.products+rep.moves+rep.guides;
  if(dry) return rep;

  /* ---- ลงมือรวม ---- */
  newProducts.forEach(function(p){ base.products.push(clone(p)); });
  ['customers','suppliers'].forEach(function(k){ addParties[k].forEach(function(x){ base[k].push(clone(x)); }); });
  function fixDoc(d){
    var x=clone(d);
    (x.items||[]).forEach(function(it){ it.productId=mapPid(it.productId); });
    return x;
  }
  addDocs.forEach(function(d){ base.docs.push(fixDoc(d)); });
  updDocs.forEach(function(d){ base.docs[dIdx[d.id]]=fixDoc(d); });
  base.moves=base.moves.filter(function(m){ return !(m.refId && touched[m.refId]); });
  addMoves.forEach(function(m){ var x=clone(m); x.productId=mapPid(x.productId); base.moves.push(x); });
  addGuides.forEach(function(g){ base.guides.push(clone(g)); });
  /* เลขรันเอกสาร: ใช้ค่าสูงสุดของทั้งสองฝั่ง กันออกเลขซ้ำกับเอกสารที่เพิ่งรวมเข้ามา */
  for(var b in (inc.counters||{})){
    if(num(inc.counters[b])>num(base.counters[b])) base.counters[b]=num(inc.counters[b]);
  }
  /* ข้อมูลกิจการ/ค่าตั้งค่า: คงของเครื่องนี้ เติมเฉพาะช่องว่าง */
  ['company','settings'].forEach(function(k){
    var src=inc[k]||{}, dst=base[k];
    for(var f in src){
      var cur=dst[f];
      if((cur===undefined||cur===null||cur==='') && src[f]!==undefined && src[f]!==null && src[f]!=='') dst[f]=clone(src[f]);
    }
  });
  /* เลขที่เอกสารซ้ำกันคนละฉบับ (เช่น ออกจากสองเครื่อง) — แจ้งให้ตรวจ ไม่เปลี่ยนเลขให้เอง
     เพราะเอกสารที่ออกให้ลูกค้าไปแล้วต้องคงเลขเดิม */
  var seenNo={};
  base.docs.forEach(function(d){
    var key=d.type+'|'+d.no;
    if(seenNo[key] && rep.dupNos.indexOf(d.no)<0) rep.dupNos.push(d.no);
    seenNo[key]=1;
  });
  return rep;
}
function mergePreview(base,inc){ return mergeData(base, migrate(clone(inc)), true); }
function mergeSummary(r){
  var parts=[];
  if(r.docs) parts.push('เอกสาร '+r.docs+' ฉบับ');
  if(r.docsUpdated) parts.push('เอกสารที่แก้ไขล่าสุด '+r.docsUpdated+' ฉบับ');

/* รวมข้อมูลเข้าเครื่องนี้ (สำรองข้อมูลปัจจุบันเป็นไฟล์ให้อัตโนมัติก่อนเสมอ) */
function applyIncoming(inc,mode,label){
  var data=migrate(clone(inc));
  if(Store.locked() || mode==='replace' || isBlankDB(DB)){
    if(!Store.locked() && !isBlankDB(DB)) doBackup();
    DB=data; recomputeStock();
    Store.lock(false); LOAD_PROBLEM=null;
    save();
    return {replaced:true, docs:DB.docs.length};
  }
  doBackup();
  var r=mergeData(DB,data,false);
  recomputeStock(); save();
  return r;
}

/* สร้างไฟล์ระบบ (.html) ที่มีข้อมูลทั้งหมดฝังอยู่ในไฟล์ — ย้ายเครื่องหรือเก็บสำรองได้ด้วยไฟล์เดียว
   เปิดบนเครื่องที่ยังไม่มีข้อมูล ระบบจะโหลดข้อมูลจากไฟล์ให้ทันที
   เปิดบนเครื่องที่มีข้อมูลอยู่แล้ว ระบบจะไม่ทับ แต่ให้เลือกรวมเฉพาะรายการที่ยังไม่มี */
var EMBED_RE=/(<script type="application\/json" id="pc-embedded">)([\s\S]*?)(<\/script>)/;
function buildDataHTML(data){
  if(!PAGE_SRC || !EMBED_RE.test(PAGE_SRC)) return '';
  /* กันข้อความในข้อมูลปิดแท็ก script ก่อนกำหนด */
  var json=JSON.stringify(data).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return PAGE_SRC.replace(EMBED_RE,function(m,a,b,c){ return a+json+c; });
}
function exportWithData(){
  if(!buildDataHTML({})){
    toast('สร้างไฟล์พร้อมข้อมูลไม่สำเร็จ กรุณาใช้ “สำรองเป็นไฟล์ JSON” แทน','bad',6000); return;
  }
  DB.meta.lastBackupAt=new Date().toISOString();
  save();
  download('PROCLEAN-OFFICE-พร้อมข้อมูล-'+stampNow()+'.html', buildDataHTML(DB), 'text/html');
  toast('ดาวน์โหลดไฟล์ระบบพร้อมข้อมูลแล้ว — ไฟล์นี้มีข้อมูลลูกค้าทั้งหมด ห้ามส่งให้ลูกค้า','good',7000);
}
/* เดารหัสคู่มือจากรหัสสินค้าหรือชื่อ ใช้เฉพาะกับข้อมูลที่บันทึกไว้ก่อนมีฟีเจอร์นี้ */
function guessGuideCode(p){
  var sku=String(p.sku||'').toUpperCase();
  var codes=['HANDSOAP-G','OILGREASE','STAINWIPE','DISHWASH','BATHROOM','HANDSOAP','FLOOR','GLASS'];
  for(var i=0;i<codes.length;i++) if(sku.indexOf(codes[i])>=0) return codes[i];
  var n=String(p.name||'');
  if(n.indexOf('เซฟโก้-จี')>=0) return 'HANDSOAP-G';
  if(n.indexOf('ล้างมือ')>=0)   return 'HANDSOAP';
  if(n.indexOf('น้ำมัน')>=0)    return 'OILGREASE';
  if(n.indexOf('ล้างจาน')>=0)   return 'DISHWASH';
  if(n.indexOf('ห้องน้ำ')>=0)   return 'BATHROOM';
  if(n.indexOf('กระจก')>=0)     return 'GLASS';
  if(n.indexOf('ขจัดคราบ')>=0)  return 'STAINWIPE';
  if(n.indexOf('ล้างพื้น')>=0)  return 'FLOOR';
  return '';
}

function byId(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function product(id){ return byId(DB.products,id); }
function customer(id){ return byId(DB.customers,id); }
function supplier(id){ return byId(DB.suppliers,id); }
function doc(id){ return byId(DB.docs,id); }

/* เลขที่เอกสาร: PREFIX + ปี พ.ศ. 2 หลัก + เดือน 2 หลัก + ลำดับ 3 หลัก
   เช่น QT6909001  — ลำดับเดินต่อรายเดือน แยกตามชนิดเอกสาร        */
function peekDocNo(type,dateIso){
  var t=DOCTYPE[type], d=dateIso||today();
  var yy=String(beYear(d)).slice(2), mm=d.slice(5,7);
  var bucket=t.prefix+yy+mm;
  var n=(DB.counters[bucket]||0)+1;
  // กันเลขชนซ้ำ หากผู้ใช้แก้เลขเองมาก่อน
  while(DB.docs.some(function(x){return x.no===bucket+String(n).padStart(3,'0');})) n++;
  return {bucket:bucket, n:n, no:bucket+String(n).padStart(3,'0')};
}
function commitDocNo(bucket,n){
  if(!DB.counters[bucket] || DB.counters[bucket]<n) DB.counters[bucket]=n;
}
