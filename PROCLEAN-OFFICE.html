    return; }
  if((el=e.target.closest('[data-reset]'))){
    confirmBox('ล้างข้อมูลทั้งหมด',
      'เอกสาร ลูกค้า และประวัติสต็อกทั้งหมดจะถูกลบถาวร แล้วเริ่มต้นใหม่ด้วยรายการสินค้ามาตรฐาน 16 รายการ<br><br>'+
      '<b>ควรกด “สำรองข้อมูล” ก่อนทำรายการนี้</b>','ล้างข้อมูลทั้งหมด',function(){
      Store.clear(); LOAD_PROBLEM=null; DB=seedDB(); save(); go('dash'); toast('ล้างข้อมูลและเริ่มต้นใหม่แล้ว');
    },true);
    return; }
  if((el=e.target.closest('[data-f]'))){
    if(el.getAttribute('data-f')==='clear'){ docFilter={q:'',status:'',from:'',to:''}; render(); }
    return; }
  if((el=e.target.closest('[data-pf]'))){
    if(el.getAttribute('data-pf')==='clear'){ prodFilter={q:'',brand:'',only:''}; render(); }
    return; }
});

document.addEventListener('input',function(e){
  var el=e.target;
  if(el.hasAttribute('data-f') && el.getAttribute('data-f')!=='clear'){
    docFilter[el.getAttribute('data-f')]=el.value;
    if(el.type==='text'){ debounceRender(); } else render();
    return;
  }
  if(el.hasAttribute('data-pf') && el.getAttribute('data-pf')!=='clear'){
    prodFilter[el.getAttribute('data-pf')]=el.value;
    if(el.type==='text'){ debounceRender(); } else render();
    return;
  }
  if(el.hasAttribute('data-p')){
    var p=product(el.getAttribute('data-id')); if(!p) return;
    var k=el.getAttribute('data-p');
    p[k] = el.type==='checkbox' ? el.checked : num(el.value);
    save(); debounceRender(true);
    return;
  }
  if(el.hasAttribute('data-c')){
    var key=el.getAttribute('data-c');
    DB.company[key] = el.type==='checkbox' ? el.checked
      : (key==='vatRate' ? num(el.value) : el.value);
    save();
    if(el.type==='checkbox') render();
    return;
  }
  if(el.hasAttribute('data-s')){
    var sk=el.getAttribute('data-s');
    DB.settings[sk]=(sk==='quoteValidDays'||sk==='sampleFollowDays') ? Math.max(0,Math.round(num(el.value))) : el.value;
    save(); return; }
});

document.addEventListener('change',function(e){
  var el=e.target;
  if(el.hasAttribute('data-logo') && el.files && el.files[0]){
    var f=el.files[0];
    if(f.size>800*1024){ toast('ไฟล์โลโก้ใหญ่เกินไป กรุณาใช้ไฟล์ไม่เกิน 800 KB','bad',5000); return; }
    var fr=new FileReader();
    fr.onload=function(){
      shrinkLogo(String(fr.result),function(url){
        DB.company.logo=url; save(); render();
        toast('อัปโหลดโลโก้แล้ว ('+Math.round(url.length/1024)+' KB)','good');
      });
    };
    fr.readAsDataURL(f);
  }
});

/* ย่อโลโก้ให้กว้างไม่เกิน 600px ก่อนเก็บ — โลโก้เต็มไฟล์ 800 KB กินพื้นที่จัดเก็บราว 1 MB
   จากที่เบราว์เซอร์ให้ทั้งระบบประมาณ 5 MB ใช้ไฟล์ที่เล็กกว่าเสมอ (ไฟล์ SVG เก็บตามเดิม) */
function shrinkLogo(dataUrl,cb){
  if(/^data:image\/svg/i.test(dataUrl)) return cb(dataUrl);
  var img=new Image();
  img.onload=function(){
    try{
      var max=600, w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      if(!w||!h||w<=max) return cb(dataUrl);
      var cv=document.createElement('canvas');
      cv.width=max; cv.height=Math.round(h*max/w);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      var out=cv.toDataURL('image/png');
      cb(out.length<dataUrl.length?out:dataUrl);
    }catch(e){ cb(dataUrl); }
  };
  img.onerror=function(){ cb(dataUrl); };
  img.src=dataUrl;
}

/* เปิดระบบไว้หลายหน้าต่าง: เมื่ออีกหน้าต่างบันทึก ให้ดึงข้อมูลล่าสุดมาใช้ทันที
   เดิมแต่ละหน้าต่างถือข้อมูลคนละชุด แล้วบันทึกทับกัน ทำให้งานของอีกหน้าต่างหายเงียบ ๆ */
var _multiWarned=false;
window.addEventListener('storage',function(e){
  if(e.key!==KEY || Store.locked() || e.newValue==null) return;
  var obj;
  try{ obj=JSON.parse(e.newValue); }catch(err){ return; }
  if(!obj || !obj.meta) return;
  DB=migrate(obj); recomputeStock();
  if(!_multiWarned){
    _multiWarned=true;
    toast('ระบบเปิดอยู่มากกว่าหนึ่งหน้าต่าง ข้อมูลจะซิงก์ให้อัตโนมัติ แต่แนะนำให้ใช้หน้าต่างเดียว','',7000);
  }
  if(route.view==='editor'){
    toast('ดึงข้อมูลล่าสุดจากอีกหน้าต่างแล้ว — เอกสารที่กำลังแก้ยังอยู่ครบ','',5000);
    return;   // ไม่วาดหน้าใหม่ระหว่างพิมพ์ เคอร์เซอร์จะได้ไม่หลุด
  }
  if(!document.querySelector('#modal-root .overlay')) render();
});

/* ปุ่ม Esc ปิดหน้าต่างบนสุด (ฟอร์ม กล่องยืนยัน หรือหน้าตัวอย่างก่อนพิมพ์) */
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape' || document.querySelector('.pick-list')) return;
  var ovs=document.querySelectorAll('#modal-root .overlay');
  if(!ovs.length) return;
  ovs[ovs.length-1].remove();
  endPrintMode();
});

var _rt=null, _pending=false;
function debounceRender(quiet){
  if(_rt) clearTimeout(_rt);
  _pending=true;
  _rt=setTimeout(function(){
    _pending=false;
    if(quiet){ /* แก้ราคาในตาราง: ไม่ re-render เพื่อไม่ให้เคอร์เซอร์เด้ง */ return; }
    var act=document.activeElement;
    var sel=act&&act.getAttribute?act.getAttribute('data-f')||act.getAttribute('data-pf'):null;
    var pos=act&&act.selectionStart;
    render();
    if(sel){
      var n=document.querySelector('[data-f="'+sel+'"],[data-pf="'+sel+'"]');
      if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
    }
  },260);
}

window.addEventListener('beforeunload',function(e){
  if(EDIT_DIRTY){ e.preventDefault(); e.returnValue=''; }
});

/* เปิดใช้งาน */
load(); recomputeStock(); save(); render();
