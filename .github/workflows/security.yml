name: Security

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Dependency / SAST / secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip-audit -r requirements.txt
          pip-audit -r requirements-dev.txt

      - name: Static security analysis (bandit, medium+ severity / high confidence)
        run: bandit -r src -ll -ii

      - name: Secret scan (detect-secrets vs committed baseline)
        run: git ls-files | xargs detect-secrets-hook --baseline .secrets.baseline
