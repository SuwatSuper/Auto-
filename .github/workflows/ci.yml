name: puopuy-ci

# ด่าน CI (offline) — รันชุดเทส + golden gate + invariants ทุกครั้งที่ push/PR
#   เป้าหมาย: จับ regression ก่อน merge (เทสเป็นสคริปต์ standalone ไม่ใช่ pytest)
#   หมายเหตุ: ชุด golden 81 ไฟล์จริง (ec61907f) ไม่อยู่ใน repo → CI ตรวจได้แค่
#             fixture (d8bcde85) + invariants + เทสหน่วย. การยืนยัน ec61907f ทำในเครื่องที่มีไฟล์จริง.

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
      PUOPUY_AUDIT_DATE: "2026-06-02"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned deps
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt pandas xlrd openpyxl rapidfuzz numpy coverage

      - name: Version gate (blocking — danger=fail, aux/optional missing=warn)
        # [B1-FIX] เดิม `|| true` ทำให้ด่านนี้เป็นแค่ของประดับ. version_gate FAIL เฉพาะเคสอันตราย
        #   (core/python/numpy major-minor-missing) เท่านั้น — aux/optional ที่ไม่ได้ติดตั้ง = WARN
        #   จึงผ่านปกติบน 3.12+pinned. เอา `|| true` ออก = ด่านนี้กันของจริงแล้ว.
        run: python version_gate.py

      - name: Invariants (4/4)
        run: python INVARIANTS/check_invariants.py

      - name: Fixture golden (ต้องได้ d8bcde85)
        run: python regression_full.py . tests/fixtures tests/fixtures/baseline_fixture.json

      - name: Unit + advisory tests (standalone)
        run: |
          fail=0
          for t in test_*.py; do
            echo "── $t"
            python "$t" || fail=1
          done
          exit $fail

      - name: Coverage gate (line ≥90%)
        # [B4-FIX] เดิมรันเฉพาะ local (run_ci.sh) — ย้ายเข้า GitHub CI ให้ coverage ตกแล้ว CI แดงจริง
        run: python coverage_gate.py

      - name: Parse canary (fixture rate — กัน parse ถอยหลังเงียบ)
        # [B4-FIX] เดิมไม่อยู่ใน GitHub CI — เพิ่มเพื่อจับ parse-rate regression ตั้งแต่ใน CI
        run: python parse_canary.py tests/fixtures --baseline tests/fixtures/canary_baseline_fixture.json
