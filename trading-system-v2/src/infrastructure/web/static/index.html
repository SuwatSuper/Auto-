<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trading Platform — Phase 1</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body class="min-h-screen p-4 bg-slate-950 text-slate-100">
  <header class="flex justify-between items-center mb-4">
    <div>
      <h1 class="text-2xl font-bold">Trading Platform</h1>
      <div class="text-xs text-slate-400">Phase 1 — Price Pipeline + Dashboard</div>
    </div>
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-2">
        <span class="led led-red" id="conn-led"></span>
        <span class="text-sm" id="conn-text">Disconnected</span>
      </div>
      <button id="emergency-stop"
        class="bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-bold py-3 px-6 rounded-lg shadow-lg">
        🛑 EMERGENCY STOP
      </button>
      <button id="emergency-reset"
        class="bg-orange-600 hover:bg-orange-700 active:bg-orange-800 text-white font-bold py-3 px-6 rounded-lg shadow-lg hidden">
        ↩ RESET STOP
      </button>
    </div>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
    <div class="card md:col-span-2">
      <div class="text-slate-400 text-sm">THB_BTC</div>
      <div class="text-5xl font-bold tabular-nums" id="price">—</div>
      <div class="text-xs text-slate-500 mt-1" id="price-meta">No data yet</div>
    </div>
    <div class="card">
      <div class="text-slate-400 text-sm mb-2">System</div>
      <div class="grid grid-cols-2 gap-y-1 text-sm">
        <div>Mode</div><div class="font-semibold text-right" id="mode">—</div>
        <div>Uptime</div><div class="font-mono text-right" id="uptime">—</div>
        <div>Msg/sec</div><div class="font-mono text-right" id="msg-rate">—</div>
        <div>Latency</div><div class="font-mono text-right" id="latency">—</div>
      </div>
      <div class="mt-3 flex gap-2">
        <button data-mode="simulator" class="mode-btn flex-1 bg-purple-700 hover:bg-purple-600 py-1.5 rounded text-xs">Simulator</button>
        <button data-mode="live" class="mode-btn flex-1 bg-blue-700 hover:bg-blue-600 py-1.5 rounded text-xs">Live</button>
      </div>
    </div>
  </div>

  <div class="card mb-4">
    <div class="text-slate-400 text-sm mb-2">Price Chart (last 5 min)</div>
    <canvas id="chart" height="80"></canvas>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="card">
      <div class="flex justify-between items-center mb-3">
        <span class="text-slate-400 text-sm">Agents</span>
        <div class="flex gap-2">
          <button id="start-all" class="bg-green-700 hover:bg-green-600 py-1 px-3 rounded text-xs">Start All</button>
          <button id="stop-all" class="bg-yellow-700 hover:bg-yellow-600 py-1 px-3 rounded text-xs">Stop All</button>
        </div>
      </div>
      <div id="agents" class="space-y-2"></div>
    </div>
    <div class="card">
      <div class="flex justify-between items-center mb-3">
        <span class="text-slate-400 text-sm">Events (last 200)</span>
        <button id="clear-log" class="text-xs text-slate-500 hover:text-slate-300">Clear</button>
      </div>
      <div id="events" class="h-64 overflow-y-auto text-xs font-mono space-y-1"></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
